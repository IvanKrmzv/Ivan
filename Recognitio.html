           '<div class="grain" aria-hidden="true"></div>' + buildPageInnerHTML(idx) + '</div>';
  }

  // remembered fit result per page, so a page always looks identical whether it
  // is rendered flat in a slot or on a turning leaf (no visible re-adjusting)
  var fitCache = {};
  function fitKey(pageEl){
    return pageEl.dataset.idx + '|' + (FONT_BASE_INDEX + fontStep) + '|' +
           Math.round(pageEl.clientWidth) + 'x' + Math.round(pageEl.clientHeight);
  }

  // Shrinks a page's text (font-size + line-height, together with its
  // paragraph spacing which is set in em) until it fits the fixed page
  // height with no scrolling, instead of letting it overflow/scroll.
  function applyScale(body, baseSize, scale){
    if(scale >= 0.999){ body.style.fontSize = ''; body.style.lineHeight = ''; return; }
    body.style.fontSize = (baseSize * scale) + 'px';
    body.style.lineHeight = Math.max(1.34, 1.82 - (1 - scale) * 0.95);
  }

  function fitPageText(pageEl){
    if(!pageEl || !pageEl.isConnected) return;
    var body = pageEl.querySelector('.page-body');
    if(!body) return;
    body.style.fontSize = '';
    body.style.lineHeight = '';
    var baseSize = parseFloat(window.getComputedStyle(body).fontSize);
    var key = fitKey(pageEl);
    var cached = fitCache[key];
    if(cached !== undefined){ applyScale(body, baseSize, cached); return; }
    if(pageEl.scrollHeight <= pageEl.clientHeight + 1){ fitCache[key] = 1; return; }
    // binary search the largest scale that still fits: fewer reflows, exact fit
    var lo = 0.54, hi = 1, best = 0.54;
    for(var i = 0; i < 8; i++){
      var mid = (lo + hi) / 2;
      applyScale(body, baseSize, mid);
      if(pageEl.scrollHeight <= pageEl.clientHeight + 1){ best = mid; lo = mid; }
      else { hi = mid; }
    }
    applyScale(body, baseSize, best);
    fitCache[key] = best;
  }

  function fitAllVisiblePages(){
    var pages = pagesEl.querySelectorAll(':scope > .page');
    pages.forEach(fitPageText);
  }

  function renderStatic(startIdx){
    if(isDesktop()){
      pagesEl.innerHTML = slotHTML(startIdx, 'left') + slotHTML(startIdx+1, 'right');
    } else {
      pagesEl.innerHTML = slotHTML(startIdx, 'single');
    }
    fitAllVisiblePages();
  }

  function applyFont(){
    var i = FONT_BASE_INDEX + fontStep;
    fitCache = {};
    document.documentElement.style.setProperty('--reader-size', FONT_SIZES[i]);
    document.documentElement.style.setProperty('--reader-lh', LINE_HEIGHTS[i]);
    fontDown.disabled = (i <= 0);
    fontUp.disabled = (i >= FONT_SIZES.length - 1);
    if(!reader.hidden){ fitAllVisiblePages(); }
  }

  function clampCursor(idx){
    var s = step();
    if(idx < 0) idx = 0;
    var maxStart = total - 1;
    if(s === 2){
      maxStart = (total % 2 === 0) ? total - 2 : total - 1;
      if(maxStart < 0) maxStart = 0;
    }
    if(idx > maxStart) idx = maxStart;
    return idx;
  }

  function updateChrome(){
    var s = step();
    var lastIdx = Math.min(cursor + s - 1, total - 1);
    breadcrumb.innerHTML = '<b>Recognitio</b> &middot; ' + labelFor(lastIdx);
    if(s === 2){
      var rightNum = Math.min(cursor+2, total);
      pageCounter.textContent = (cursor+1) + '\u2013' + rightNum + ' / ' + total;
    } else {
      pageCounter.textContent = (cursor+1) + ' / ' + total;
    }
    progressFill.style.width = (((lastIdx+1) / total) * 100) + '%';
    var atStart = cursor <= 0;
    var atEnd = (cursor + s) >= total;
    prevBtn.disabled = atStart; footPrev.disabled = atStart;
    nextBtn.disabled = atEnd; footNext.disabled = atEnd;
    updateTocActive(lastIdx);
  }

  function render(idx){
    cursor = clampCursor(idx);
    renderStatic(cursor);
    updateChrome();
  }

  function flip(direction){
    if(animating) return;
    var s = step();
    var newCursor = clampCursor(cursor + direction * s);
    if(newCursor === cursor) return;
    animating = true;

    if(reduceMotion){
      render(newCursor);
      animating = false;
      return;
    }

    if(isDesktop()){
      flipDesktop(direction, newCursor);
    } else {
      flipMobile(direction, newCursor);
    }
  }

  function makeLeaf(extraClass, contentIdx, side){
    var leaf = document.createElement('div');
    leaf.className = 'flip-leaf ' + extraClass;
    leaf.innerHTML = '<div class="flip-face">' + slotHTML(contentIdx, side) + '</div>';
    leaf.style.visibility = 'hidden';
    pagesEl.appendChild(leaf);
    fitPageText(leaf.querySelector('.page'));
    leaf.style.visibility = '';
    return leaf;
  }

  function flipDesktop(direction, newCursor){
    var duration = 720;
    if(direction > 0){
      // the current right page turns away (leaf shows ONLY the old content,
      // correctly oriented — no mirrored back face is ever rendered).
      var frontIdx = cursor + 1;
      var newLeftIdx = newCursor;
      var newRightIdx = newCursor + 1;

      var leaf = makeLeaf('slot-right', frontIdx, 'right');
      pagesEl.appendChild(leaf);

      // both static slots underneath can update immediately: the right slot
      // is fully covered by the leaf, and the left slot's change lands right
      // as the leaf turns edge-on (backface-visibility hides it there),
      // so the swap is never seen mid-flip.
      var rightSlot = pagesEl.querySelector('.page.right');
      if(rightSlot) rightSlot.outerHTML = slotHTML(newRightIdx, 'right');
      setTimeout(function(){
        var leftSlot = pagesEl.querySelector('.page.left');
        if(leftSlot){ leftSlot.outerHTML = slotHTML(newLeftIdx, 'left'); fitPageText(pagesEl.querySelector('.page.left')); }
      }, duration * 0.46);
      fitPageText(pagesEl.querySelector('.page.right'));

      cursor = newCursor;
      updateChrome();
      void leaf.offsetWidth;
      leaf.classList.add('animate');
      finishAfter(leaf, duration);
    } else {
      var frontIdxP = cursor;
      var newLeftIdxP = newCursor;
      var newRightIdxP = newCursor + 1;

      var leafP = makeLeaf('slot-left', frontIdxP, 'left');
      pagesEl.appendChild(leafP);

      var leftSlotP = pagesEl.querySelector('.page.left');
      if(leftSlotP) leftSlotP.outerHTML = slotHTML(newLeftIdxP, 'left');
      setTimeout(function(){
        var rightSlotP = pagesEl.querySelector('.page.right');
        if(rightSlotP){ rightSlotP.outerHTML = slotHTML(newRightIdxP, 'right'); fitPageText(pagesEl.querySelector('.page.right')); }
      }, duration * 0.46);
      fitPageText(pagesEl.querySelector('.page.left'));

      cursor = newCursor;
      updateChrome();
      void leafP.offsetWidth;
      leafP.classList.add('animate');
      finishAfter(leafP, duration);
    }
  }

  function flipMobile(direction, newCursor){
    var duration = 650;
    var frontIdx = cursor;
    var backIdx = newCursor;

    var leaf = makeLeaf('slot-full ' + (direction > 0 ? 'dir-next' : 'dir-prev'), frontIdx, 'single');
    pagesEl.appendChild(leaf);

    // fully covered by the leaf for the whole first half of the turn, so it
    // can be updated immediately — it only becomes visible once the leaf
    // is edge-on and hidden by backface-visibility.
    var staticSlot = pagesEl.querySelector('.page.single');
    if(staticSlot){ staticSlot.outerHTML = slotHTML(backIdx, 'single'); fitPageText(pagesEl.querySelector('.page.single')); }

    cursor = newCursor;
    updateChrome();
    void leaf.offsetWidth;
    leaf.classList.add('animate');
    finishAfter(leaf, duration);
  }

  function finishAfter(leaf, duration){
    var done = false;
    function finish(){
      if(done) return;
      done = true;
      leaf.remove();
      animating = false;
    }
    leaf.addEventListener('transitionend', finish, {once:true});
    setTimeout(finish, duration + 200);
  }

  function go(direction){ if(window.SFX && window.SFX.pageTurn) window.SFX.pageTurn(); flip(direction); }

  function buildToc(){
    tocList.innerHTML = '';
    TOC.forEach(function(item){
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#';
      a.dataset.page = item.page;
      if(item.kind === 'season'){
        a.className = 'season';
        a.textContent = 'Qeyd ' + item.num + ': ' + item.title;
      } else if(item.kind === 'chapter'){
        a.className = 'chapter';
        a.textContent = 'Hissə ' + item.num + ': ' + item.title;
      } else {
        a.className = 'preface';
        a.textContent = item.title;
      }
      a.addEventListener('click', function(e){
        e.preventDefault();
        render(parseInt(a.dataset.page, 10));
        closeToc();
      });
      li.appendChild(a);
      tocList.appendChild(li);
    });
  }

  function updateTocActive(lastIdx){
    var links = tocList.querySelectorAll('a');
    var best = null;
    links.forEach(function(a){
      var pg = parseInt(a.dataset.page, 10);
      a.classList.remove('active');
      if(pg <= lastIdx) best = a;
    });
    if(best) best.classList.add('active');
  }

  function openToc(){ tocPanel.classList.add('open'); tocScrim.classList.add('open'); }
  function closeToc(){ tocPanel.classList.remove('open'); tocScrim.classList.remove('open'); }

  // ---- tea cup: picked up and sipped on an occasional, semi-random interval ----
  var teaCup = document.getElementById('teaCup');
  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
    }
  }
  // wet, layered slurp: bubbling intake + liquid gurgle + a soft swallow
  function playSipSound(){
    if(!audioCtx) return;
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    var t0 = audioCtx.currentTime + 0.02;
    var master = audioCtx.createGain();
    master.gain.value = 0.9;
    master.connect(audioCtx.destination);

    function noiseBuffer(dur){
      var n = Math.floor(audioCtx.sampleRate * dur);
      var buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      var last = 0;
      for(var i = 0; i < n; i++){
        var white = Math.random() * 2 - 1;
        last = 0.72 * last + 0.28 * white; // brown-ish: wetter, less hissy
        d[i] = last * 1.6;
      }
      return buf;
    }

    // 1) two sucking intakes
    [0, 0.34].forEach(function(offset, k){
      var dur = k === 0 ? 0.42 : 0.34;
      var start = t0 + offset;
      var src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer(dur);
      var bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 3.2;
      bp.frequency.setValueAtTime(420, start);
      bp.frequency.exponentialRampToValueAtTime(1500, start + dur * 0.55);
      bp.frequency.exponentialRampToValueAtTime(620, start + dur);
      var lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2600;
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(k === 0 ? 0.34 : 0.24, start + 0.09);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(master);
      src.start(start); src.stop(start + dur);

      // bubbling droplets riding on the intake
      for(var b = 0; b < 7; b++){
        var bt = start + 0.04 + Math.random() * (dur - 0.08);
        var osc = audioCtx.createOscillator();
        osc.type = 'sine';
        var f = 340 + Math.random() * 520;
        osc.frequency.setValueAtTime(f, bt);
        osc.frequency.exponentialRampToValueAtTime(f * 1.9, bt + 0.05);
        var bg = audioCtx.createGain();
        bg.gain.setValueAtTime(0.0001, bt);
        bg.gain.exponentialRampToValueAtTime(0.05 + Math.random() * 0.05, bt + 0.006);
        bg.gain.exponentialRampToValueAtTime(0.0001, bt + 0.07);
        osc.connect(bg); bg.connect(master);
        osc.start(bt); osc.stop(bt + 0.08);
      }
    });

    // 2) swallow: low descending gulp
    var st = t0 + 0.82;
    var gulp = audioCtx.createOscillator();
    gulp.type = 'sine';
    gulp.frequency.setValueAtTime(210, st);
    gulp.frequency.exponentialRampToValueAtTime(78, st + 0.2);
    var gg = audioCtx.createGain();
    gg.gain.setValueAtTime(0.0001, st);
    gg.gain.exponentialRampToValueAtTime(0.16, st + 0.03);
    gg.gain.exponentialRampToValueAtTime(0.0001, st + 0.24);
    gulp.connect(gg); gg.connect(master);
    gulp.start(st); gulp.stop(st + 0.26);

    // 3) cup set back down on the saucer
    var ct = t0 + 1.9;
    var clink = audioCtx.createOscillator();
    clink.type = 'triangle';
    clink.frequency.setValueAtTime(1750, ct);
    clink.frequency.exponentialRampToValueAtTime(1180, ct + 0.12);
    var cg = audioCtx.createGain();
    cg.gain.setValueAtTime(0.0001, ct);
    cg.gain.exponentialRampToValueAtTime(0.1, ct + 0.006);
    cg.gain.exponentialRampToValueAtTime(0.0001, ct + 0.22);
    clink.connect(cg); cg.connect(master);
    clink.start(ct); clink.stop(ct + 0.24);
  }

  window.__playSipSound = playSipSound;
  window.__getAudio = function(){ ensureAudio(); if(audioCtx && audioCtx.state === "suspended"){ audioCtx.resume(); } return audioCtx; };
  var sipTimer = null;
  function scheduleSip(){
    var delay = 42000 + Math.random() * 34000;
    sipTimer = setTimeout(function(){
      if(!reader.hidden && window.DRINK){ window.DRINK.sip(); }
      scheduleSip();
    }, delay);
  }

  var candleTipEl = document.getElementById('candleTip');
  var candleTipTimer = null;
  function hideCandleTip(){
    if(candleTipEl){ candleTipEl.classList.remove('show'); }
    if(candleTipTimer){ clearTimeout(candleTipTimer); candleTipTimer = null; }
  }
  window.hideCandleTip = hideCandleTip;
  function showCandleTip(){
    if(!candleTipEl || window.__MOBILE_CANDLE) return;
    setTimeout(function(){
      candleTipEl.classList.remove('tip-right');
      candleTipEl.classList.add('show');
      var r = candleTipEl.getBoundingClientRect();
      if(r.right > window.innerWidth - 8){ candleTipEl.classList.add('tip-right'); }
    }, 700);

    candleTipTimer = setTimeout(hideCandleTip, 9000);
  }

  startBtn.addEventListener('click', function(){
    cover.hidden = true;
    reader.hidden = false;
    document.body.classList.add('reading');

    ensureAudio();
    render(0);
    pagesEl.focus();
    if(!sipTimer){ scheduleSip(); }
    showCandleTip();
  });


  prevBtn.addEventListener('click', function(){ go(-1); });
  nextBtn.addEventListener('click', function(){ go(1); });
  footPrev.addEventListener('click', function(){ go(-1); });
  footNext.addEventListener('click', function(){ go(1); });

  tocToggle.addEventListener('click', openToc);
  tocClose.addEventListener('click', closeToc);
  tocScrim.addEventListener('click', closeToc);

  fontUp.addEventListener('click', function(){
    if(fontStep < FONT_SIZES.length - 1 - FONT_BASE_INDEX){ fontStep++; applyFont(); }
  });
  fontDown.addEventListener('click', function(){
    if(fontStep > -FONT_BASE_INDEX){ fontStep--; applyFont(); }
  });

  document.addEventListener('keydown', function(e){
    if(reader.hidden) return;
    if(e.key === 'ArrowRight') go(1);
    if(e.key === 'ArrowLeft') go(-1);
    if(e.key === 'Escape') closeToc();
  });

  var touchStartX = null, touchStartY = null;
  pagesEl.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  pagesEl.addEventListener('touchend', function(e){
    if(touchStartX === null) return;
    var __v = window.__vec(e.changedTouches[0].clientX - touchStartX, e.changedTouches[0].clientY - touchStartY);
    var dx = __v.x, dy = __v.y;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if(dx < 0) go(1); else go(-1);
    }
    touchStartX = null; touchStartY = null;
  }, {passive:true});

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      fitCache = {};
      if(!reader.hidden && !animating) render(cursor);
    }, 150);
  });

  buildToc();
  applyFont();
})();
</script>
<script>
/* =========================================================================
   Person — masaüstü rekvizitləri: şam (böyük, realistik, sürüklənən),
   şama əsasən işıqlandırma, külqabı + siqaretlər, köhnə vərəq izləri,
   yumşaq içki azalması, pipet, yandan doldurma və gizli düymələr.
   ========================================================================= */
(function(){
  'use strict';

  var reader = document.getElementById('reader');
  var stage = document.querySelector('.book-stage');
  var pagesEl = document.getElementById('pages');
  var candle = document.getElementById('candleProp');
  var ashtray = document.getElementById('ashtrayProp');
  var pot = document.getElementById('pourPot');
  var cup = document.getElementById('teaCup');
  var straw = document.getElementById('cupStraw');
  var note = document.getElementById('propNote');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* footer/bar must stay above the light layer */
  var st = document.createElement('style');
  st.textContent = '.reader-footer{position:relative; z-index:30;}';
  document.head.appendChild(st);

  /* ----------------------------------------------------------------- audio */
  function ctx(){ return window.__getAudio ? window.__getAudio() : null; }

  function noiseBuf(ac, dur, smooth){
    var n = Math.max(1, Math.floor(ac.sampleRate * dur));
    var buf = ac.createBuffer(1, n, ac.sampleRate);
    var d = buf.getChannelData(0), last = 0, s = smooth === undefined ? 0.35 : smooth;
    for(var i = 0; i < n; i++){
      var w = Math.random() * 2 - 1;
      last = s * last + (1 - s) * w;
      d[i] = last * 1.4;
    }
    return buf;
  }

  /* səhifə çevirmə: iki qat kağız sürtünməsi + kənarın "tık" səsi */
  function pageTurn(){
    var ac = ctx(); if(!ac) return;
    var t0 = ac.currentTime + 0.01;
    var master = ac.createGain(); master.gain.value = 0.85; master.connect(ac.destination);

    [{o:0, dur:0.30, peak:0.13, f0:900,  f1:3400}, {o:0.14, dur:0.34, peak:0.10, f0:1500, f1:2200}]
      .forEach(function(L){
        var start = t0 + L.o;
        var src = ac.createBufferSource(); src.buffer = noiseBuf(ac, L.dur, 0.18);
        var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
        bp.frequency.setValueAtTime(L.f0, start);
        bp.frequency.exponentialRampToValueAtTime(L.f1, start + L.dur * 0.5);
        bp.frequency.exponentialRampToValueAtTime(L.f0 * 0.8, start + L.dur);
        var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 480;
        var g = ac.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(L.peak, start + L.dur * 0.34);
        g.gain.exponentialRampToValueAtTime(0.0001, start + L.dur);
        src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(master);
        src.start(start); src.stop(start + L.dur + 0.02);
      });

    /* vərəqin masaya düşməsi */
    var ft = t0 + 0.40;
    var fs = ac.createBufferSource(); fs.buffer = noiseBuf(ac, 0.12, 0.5);
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
    var fg = ac.createGain();
    fg.gain.setValueAtTime(0.0001, ft);
    fg.gain.exponentialRampToValueAtTime(0.07, ft + 0.012);
    fg.gain.exponentialRampToValueAtTime(0.0001, ft + 0.12);
    fs.connect(lp); lp.connect(fg); fg.connect(master);
    fs.start(ft); fs.stop(ft + 0.13);
  }

  /* pipetlə sormaq: nazik, uzun, hava qarışıq sorma */
  function strawSip(){
    var ac = ctx(); if(!ac) return;
    var t0 = ac.currentTime + 0.02;
    var master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination);
    var dur = 1.5;
    var src = ac.createBufferSource(); src.buffer = noiseBuf(ac, dur, 0.55);
    var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 6.5;
    bp.frequency.setValueAtTime(700, t0);
    bp.frequency.linearRampToValueAtTime(1350, t0 + dur * 0.7);
    bp.frequency.linearRampToValueAtTime(900, t0 + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.18);
    g.gain.setValueAtTime(0.16, t0 + dur * 0.62);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur);

    for(var b = 0; b < 9; b++){
      var bt = t0 + 0.1 + Math.random() * (dur - 0.2);
      var osc = ac.createOscillator(); osc.type = 'sine';
      var f = 520 + Math.random() * 700;
      osc.frequency.setValueAtTime(f, bt);
      osc.frequency.exponentialRampToValueAtTime(f * 1.7, bt + 0.04);
      var bg = ac.createGain();
      bg.gain.setValueAtTime(0.0001, bt);
      bg.gain.exponentialRampToValueAtTime(0.03 + Math.random() * 0.03, bt + 0.005);
      bg.gain.exponentialRampToValueAtTime(0.0001, bt + 0.06);
      osc.connect(bg); bg.connect(master);
      osc.start(bt); osc.stop(bt + 0.07);
    }
  }

  /* yandan doldurma: axan maye */
  function pourSound(dur){
    var ac = ctx(); if(!ac) return;
    var t0 = ac.currentTime + 0.02;
    var master = ac.createGain(); master.gain.value = 0.75; master.connect(ac.destination);
    var src = ac.createBufferSource(); src.buffer = noiseBuf(ac, dur, 0.4);
    var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.6;
    bp.frequency.setValueAtTime(950, t0);
    bp.frequency.linearRampToValueAtTime(1900, t0 + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.11, t0 + 0.2);
    g.gain.setValueAtTime(0.11, t0 - 0.3 + dur);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur);

    for(var b = 0; b < 16; b++){
      var bt = t0 + 0.15 + Math.random() * (dur - 0.3);
      var osc = ac.createOscillator(); osc.type = 'sine';
      var f = 240 + Math.random() * 460;
      osc.frequency.setValueAtTime(f * 1.6, bt);
      osc.frequency.exponentialRampToValueAtTime(f, bt + 0.07);
      var bg = ac.createGain();
      bg.gain.setValueAtTime(0.0001, bt);
      bg.gain.exponentialRampToValueAtTime(0.035, bt + 0.006);
      bg.gain.exponentialRampToValueAtTime(0.0001, bt + 0.09);
      osc.connect(bg); bg.connect(master);
      osc.start(bt); osc.stop(bt + 0.1);
    }
  }

  window.SFX = { pageTurn: pageTurn, strawSip: strawSip, pour: pourSound };

  /* --------------------------------------------------- şama əsasən işıq */
  var root = document.documentElement;
  function updateLight(){
    if(!candle) return;
    if(window.__MOBILE_CANDLE){
      /* mobil: işıq mənbəyi sabitdir, şam yerindən tərpənmir */
      root.style.setProperty('--cx', '50%');
      root.style.setProperty('--cy', '26%');
      return;
    }
    var r = candle.getBoundingClientRect();
    if(!r.width) return;
    var __rr = document.getElementById('rotor').getBoundingClientRect();
    var __p = window.__local(r.left + r.width * 0.5, r.top + r.width * 0.42, __rr);
    var x = __p.x;
    var y = __p.y; /* alov təxminən buradadır */
    root.style.setProperty('--cx', x.toFixed(1) + 'px');
    root.style.setProperty('--cy', y.toFixed(1) + 'px');
  }

  var dragging = false, grabDX = 0, grabDY = 0;
  if(candle && !window.__MOBILE_CANDLE){
    candle.addEventListener('pointerdown', function(e){
      var r = candle.getBoundingClientRect();
      var __p = window.__local(e.clientX, e.clientY, r);
      grabDX = __p.x; grabDY = __p.y;
      candle.style.right = 'auto';
      candle.style.left = candle.offsetLeft + 'px';
      candle.style.top = candle.offsetTop + 'px';
      dragging = true;
      candle.classList.add('dragging');
      if(window.hideCandleTip){ window.hideCandleTip(); }

      candle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    candle.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var s = stage.getBoundingClientRect();
      var w = candle.offsetWidth, h = candle.offsetHeight;
      var __p = window.__local(e.clientX, e.clientY, s);
      var nx = __p.x - grabDX;
      var ny = __p.y - grabDY;
      nx = Math.max(-w * 0.25, Math.min(stage.offsetWidth - w * 0.75, nx));
      ny = Math.max(-h * 0.35, Math.min(stage.offsetHeight - h * 0.4, ny));
      candle.style.left = nx + 'px';
      candle.style.top = ny + 'px';
      updateLight();
    });
    function endDrag(){ if(!dragging) return; dragging = false; candle.classList.remove('dragging'); }
    candle.addEventListener('pointerup', endDrag);
    candle.addEventListener('pointercancel', endDrag);
  }
  window.addEventListener('resize', updateLight);
  window.addEventListener('scroll', updateLight, {passive:true});
  setTimeout(updateLight, 80);
  setInterval(updateLight, 900); /* layout dəyişəndə də dəqiq qalsın */

  /* --------------------------------------- vərəqlərdə əziklər və ləkələr */
  function rng(seed){
    var s = seed * 9301 + 49297;
    return function(){ s = (s * 9301 + 49297) % 233280; return s / 233280; };
  }
  function marksFor(idx){
    var r = rng(idx + 7);
    var layers = [], sheen = [];

    /* ləkələr — bəzi vərəqlərdə çay/qəhvə damcıları */
    var stains = r() < 0.55 ? 1 + Math.floor(r() * 3) : 0;
    for(var i = 0; i < stains; i++){
      var x = (8 + r() * 84).toFixed(1), y = (8 + r() * 84).toFixed(1);
      var rw = (5 + r() * 13).toFixed(1), rh = (4 + r() * 10).toFixed(1);
      var a = (0.05 + r() * 0.11).toFixed(3);
      layers.push('radial-gradient(ellipse ' + rw + '% ' + rh + '% at ' + x + '% ' + y + '%, rgba(122,84,32,' + a + '), rgba(122,84,32,' + (a * 0.45).toFixed(3) + ') 62%, transparent 74%)');
      if(r() < 0.6){
        layers.push('radial-gradient(ellipse ' + (rw * 0.55).toFixed(1) + '% ' + (rh * 0.55).toFixed(1) + '% at ' + x + '% ' + y + '%, rgba(96,62,20,' + (a * 0.8).toFixed(3) + '), transparent 70%)');
      }
    }

    /* kiçik nöqtəvi ləkələr */
    var dots = Math.floor(r() * 5);
    for(var d = 0; d < dots; d++){
      layers.push('radial-gradient(circle ' + (2 + r() * 4).toFixed(1) + 'px at ' + (5 + r() * 90).toFixed(1) + '% ' + (5 + r() * 90).toFixed(1) + '%, rgba(88,58,20,' + (0.10 + r() * 0.14).toFixed(3) + '), transparent 70%)');
    }

    /* əziklər — qırışmış kağız qatları */
    var creases = r() < 0.7 ? 1 + Math.floor(r() * 3) : 0;
    for(var c = 0; c < creases; c++){
      var ang = (r() * 180).toFixed(1);
      var pos = (18 + r() * 64).toFixed(1);
      var soft = (0.35 + r() * 0.6).toFixed(2);
      sheen.push('linear-gradient(' + ang + 'deg, transparent calc(' + pos + '% - ' + soft + '%), rgba(255,255,255,0.5) ' + pos + '%, rgba(70,52,22,0.3) calc(' + pos + '% + 0.12%), transparent calc(' + pos + '% + ' + soft + '%))');
    }
    /* künc əziyi */
    if(r() < 0.4){
      var corner = r() < 0.5 ? '100% 100%' : '0% 100%';
      sheen.push('radial-gradient(circle 9% at ' + corner + ', rgba(255,255,255,0.35), rgba(80,60,26,0.24) 45%, transparent 62%)');
    }
    return {layers: layers, sheen: sheen};
  }

  function decorate(page){
    if(!page || page.querySelector(':scope > .marks')) return;
    var idx = parseInt(page.dataset.idx, 10);
    if(isNaN(idx)) return;
    var m = marksFor(idx);
    if(!m.layers.length && !m.sheen.length) return;
    var el = document.createElement('div');
    el.className = 'marks';
    el.setAttribute('aria-hidden', 'true');
    if(m.layers.length) el.style.backgroundImage = m.layers.join(',');
    if(m.sheen.length){
      var sh = document.createElement('div');
      sh.className = 'sheen';
      sh.style.backgroundImage = m.sheen.join(',');
      el.appendChild(sh);
    }
    page.appendChild(el);
  }

  function decorateAll(){ document.querySelectorAll('.page').forEach(decorate); }
  if(pagesEl){
    new MutationObserver(decorateAll).observe(pagesEl, {childList:true, subtree:true});
  }
  decorateAll();

  /* --------------------------------------------------- içki sistemi */
  var DRINKS = [
    {name:'Qəhvə',   stops:['#5b3418','#3a1f0c','#201004'], stream:'#3a1f0c'},
    {name:'Çay',     stops:['#a4551f','#7c3a12','#4a1f08'], stream:'#7c3a12'},
    {name:'Yaşıl çay', stops:['#b8c46a','#8aa03d','#5c6c21'], stream:'#8aa03d'},
    {name:'Su',      stops:['#cfe6ef','#a9cfe0','#7fb0c6'], stream:'#a9cfe0'},
    {name:'Şərab',   stops:['#8b1d33','#5e0f22','#340714'], stream:'#5e0f22'},
    {name:'Süd',     stops:['#fffaf0','#f4ecdc','#ddd2bb'], stream:'#f4ecdc'}
  ];
  var teaGroup = cup ? cup.querySelector('.cup-tea') : null;
  var teaStops = cup ? cup.querySelectorAll('#tea stop') : [];
  var state = {type:1, level:1, straw:false, busy:false, refilling:false, off:false};

  function showNote(txt){
    if(!note) return;
    note.textContent = txt;
    note.classList.add('show');
    clearTimeout(showNote._t);
    showNote._t = setTimeout(function(){ note.classList.remove('show'); }, 1600);
  }

  function applyType(){
    var d = DRINKS[state.type];
    for(var i = 0; i < teaStops.length && i < d.stops.length; i++){
      teaStops[i].setAttribute('stop-color', d.stops[i]);
    }
    root.style.setProperty('--liquid-stream', d.stream);
  }

  function applyLevel(){
    if(!teaGroup) return;
    var l = Math.max(0, Math.min(1, state.level));
    var dy = (1 - l) * 20;              /* maye səthi aşağı düşür */
    var sy = 0.34 + 0.66 * l;           /* səth ellipsi daralır */
    teaGroup.style.transform = 'translateY(' + dy.toFixed(2) + 'px) scaleY(' + sy.toFixed(3) + ')';
    teaGroup.style.opacity = l < 0.03 ? '0' : '1';
  }

  function drain(amount, delay){
    setTimeout(function(){
      state.level = Math.max(0, state.level - amount);
      applyLevel();
      if(state.level <= 0.02 && !state.refilling){
        setTimeout(function(){ if(state.level <= 0.02) refill(); }, 2200);
      }
    }, delay || 0);
  }

  function sip(){
    if(!cup || state.off || state.busy || state.refilling) return;
    if(state.level <= 0.02){
      if(!state.refilling) refill();
      return;
    }
    state.busy = true;
    if(state.straw){
      /* pipet varsa stəkan qalxmır — yalnız maye azalır, pipet tərpənir */
      cup.classList.add('no-lift', 'sipping');
      if(straw){ straw.classList.add('drinking'); }
      if(window.SFX) window.SFX.strawSip();
      drain(0.06, 400);
      setTimeout(function(){
        cup.classList.remove('sipping', 'no-lift');
        if(straw) straw.classList.remove('drinking');
        state.busy = false;
      }, 2700);
    } else {
      cup.classList.remove('no-lift');
      cup.classList.add('sipping');
      if(window.__playSipSound){ setTimeout(window.__playSipSound, 900); }
      drain(0.07, 1100);
      setTimeout(function(){
        cup.classList.remove('sipping');
        state.busy = false;
      }, 3450);
    }
  }

  function refill(){
    if(state.off || state.refilling || !pot) return;
    state.refilling = true;
    var d = DRINKS[state.type];
    showNote(d.name + ' süzülür');
    pot.classList.add('in');
    setTimeout(function(){
      pot.classList.add('tilt');
      if(window.SFX) window.SFX.pour(2.1);
      var steps = 22, i = 0;
      var iv = setInterval(function(){
        i++;
        state.level = Math.min(1, i / steps);
        applyLevel();
        if(i >= steps){ clearInterval(iv); }
      }, 90);
      setTimeout(function(){
        pot.classList.remove('tilt');
        setTimeout(function(){
          pot.classList.remove('in');
          state.refilling = false;
        }, 700);
      }, 2200);
    }, 650);
  }

  window.DRINK = {sip: sip, refill: refill};

  /* --------------------------------------------------- gizli düymələr */
  var btnDrink = document.getElementById('btnDrink');
  var btnStraw = document.getElementById('btnStraw');
  var btnRefill = document.getElementById('btnRefill');
  var btnEmpty = document.getElementById('btnEmpty');
  var btnAsh = document.getElementById('btnAsh');

  if(btnDrink) btnDrink.addEventListener('click', function(){
    state.type = (state.type + 1) % DRINKS.length;
    applyType();
    showNote(DRINKS[state.type].name);
  });

  if(btnStraw) btnStraw.addEventListener('click', function(){
    state.straw = !state.straw;
    if(straw) straw.classList.toggle('on', state.straw);
    btnStraw.classList.toggle('active', state.straw);
    showNote(state.straw ? 'Pipet əlavə olundu' : 'Pipet götürüldü');
  });

  if(btnRefill) btnRefill.addEventListener('click', function(){
    if(state.level > 0.95){ showNote('Stəkan doludur'); return; }
    refill();
  });

  if(btnEmpty) btnEmpty.addEventListener('click', function(){
    state.level = 0;
    applyLevel();
    showNote('Stəkan boşaldıldı');
  });

  var btnNoDrink = document.getElementById('btnNoDrink');
  var cupCorner = document.getElementById('cupCorner');
  if(btnNoDrink) btnNoDrink.addEventListener('click', function(){
    state.off = !state.off;
    btnNoDrink.classList.toggle('active', state.off);
    if(cupCorner) cupCorner.classList.toggle('gone', state.off);
    if(pot) pot.classList.toggle('gone', state.off);
    if(state.off && cup){ cup.classList.remove('sipping','no-lift'); state.busy = false; }
    showNote(state.off ? 'İçki götürüldü' : 'İçki qaytarıldı');
  });

  if(btnAsh) btnAsh.addEventListener('click', function(){
    if(!ashtray) return;
    var gone = ashtray.classList.toggle('gone');
    btnAsh.classList.toggle('active', gone);
    showNote(gone ? 'Külqabı yığışdırıldı' : 'Külqabı qaytarıldı');
  });

  applyType();
  applyLevel();
})();

</script>

<script>
(function(){
  'use strict';
  var MIN_W = 1180, MIN_H = 900;           /* kompüter versiyasının məntiqi eni */
  var rotor = document.getElementById('rotor');
  var hint = document.getElementById('rotateHint');
  window.__stage = { rotate:false, scale:1 };

  window.__local = function(cx, cy, rect){
    var st = window.__stage, s = st.scale || 1;
    return st.rotate
      ? { x:(cy - rect.top) / s, y:(rect.right - cx) / s }
      : { x:(cx - rect.left) / s, y:(cy - rect.top) / s };
  };
  window.__vec = function(dx, dy){
    var st = window.__stage, s = st.scale || 1;
    return st.rotate ? { x: dy / s, y: -dx / s } : { x: dx / s, y: dy / s };
  };

  var coarse = window.matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
  var locked = false;

  function layout(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var portrait = vh > vw;
    var rotate = false, scale = 1;

    if(coarse){
      if(portrait){
        /* Telefon dikinə tutulub: səhnə 90° fırladılır ki, kompüter görünüşü qalsın */
        rotate = true;
        scale = Math.min(vh / MIN_W, vw / MIN_H);
      }else{
        scale = Math.min(vw / MIN_W, vh / MIN_H);
      }
      if(scale > 1) scale = 1;
    }

    var w, h;
    if(rotate){ w = Math.round(vh / scale); h = Math.round(vw / scale); }
    else { w = Math.round(vw / scale); h = Math.round(vh / scale); }
    rotor.style.width = w + 'px';
    rotor.style.height = h + 'px';
    rotor.style.transform = 'translate(-50%,-50%) scale(' + scale + ')' + (rotate ? ' rotate(90deg)' : '');
    document.body.classList.remove('is-phone');
    window.__stage = { rotate: rotate, scale: scale };
    if(hint) hint.classList.toggle('show', rotate && !locked);
    if(hint && rotate) setTimeout(function(){ hint.classList.remove('show'); }, 2600);
  }

  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 120); });
  if(screen.orientation && screen.orientation.addEventListener){
    screen.orientation.addEventListener('change', function(){ setTimeout(layout, 120); });
  }

  /* Kitab açılan kimi: tam ekran + ekranı avtomatik yana çevir */
  function goLandscape(){
    if(!coarse) return;
    var el = document.documentElement;
    var fs = el.requestFullscreen || el.webkitRequestFullscreen;
    var p;
    try{ p = fs ? fs.call(el) : Promise.resolve(); }catch(err){ p = Promise.reject(err); }
    Promise.resolve(p).catch(function(){}).then(function(){
      try{
        if(screen.orientation && screen.orientation.lock){
          screen.orientation.lock('landscape').then(function(){
            locked = true;
            setTimeout(layout, 120);
          }).catch(function(){});
        }
      }catch(err){}
      setTimeout(layout, 200);
    });
  }

  document.addEventListener('click', function(e){
    if(!coarse) return;
    if(e.target.closest && e.target.closest('#startBtn')) goLandscape();
  }, true);
})();

</script>

<script>
/* realistik şam titrəyişi + yavaş nəfəs + çox yavaş ərimə */
(function(){
  var root=document.documentElement;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  var cur=1,target=1,gustUntil=0,gustDepth=0,last=0;
  /* nəfəs: ~1 saniyəlik zəifləmə/güclənmə dalğaları */
  var breath=1,bTarget=1,bUntil=0,startT=0,meltStart=0;
  function rnd(a,b){return a+Math.random()*(b-a);}
  function tick(t){
    if(!startT){ startT=t; meltStart=t; }
    if(t-last>70){
      last=t;
      target=rnd(0.93,1.07);
      if(t>gustUntil&&Math.random()<0.03){ gustUntil=t+rnd(320,900); gustDepth=rnd(0.68,0.84); }
      if(t<gustUntil) target*=gustDepth;
    }
    /* hər dəfə ~1 saniyəlik yeni nəfəs hədəfi: bəzən zəif, bəzən güclü */
    if(t>bUntil){
      bUntil=t+rnd(700,1600);
      bTarget=Math.random()<0.5?rnd(0.82,0.95):rnd(1.02,1.14);
    }
    breath+=(bTarget-breath)*0.012;
    cur+=(target-cur)*0.16;
    root.style.setProperty('--flick',cur.toFixed(3));
    root.style.setProperty('--breath',breath.toFixed(3));
    root.style.setProperty('--lint',(0.88+0.22*cur).toFixed(3));
    /* ərimə: təxminən 45 dəqiqəyə 22 vahid — gözlə güclə seçilən yavaşlıqda */
    var melt=Math.min(22,(t-meltStart)/1000*(22/2700));
    root.style.setProperty('--melt',melt.toFixed(3));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>

<script>
/* oxucunun yerinə uyğun hava durumu — arxa planda çox zəif ambient səs */
(function(){
  var ac=null, master=null, started=false, weather=null;

  function makeNoise(ac, dur){
    var n=Math.floor(ac.sampleRate*dur), buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0), last=0;
    for(var i=0;i<n;i++){ var w=Math.random()*2-1; last=0.86*last+0.14*w; d[i]=last*2.2; }
    return buf;
  }

  function layer(cfg){
    var src=ac.createBufferSource();
    src.buffer=makeNoise(ac,6); src.loop=true;
    var f=ac.createBiquadFilter();
    f.type=cfg.type; f.frequency.value=cfg.freq; f.Q.value=cfg.q||0.7;
    var g=ac.createGain(); g.gain.value=cfg.gain;
    src.connect(f); f.connect(g); g.connect(master); src.start();
    if(cfg.lfo){
      var lfo=ac.createOscillator(), lg=ac.createGain();
      lfo.frequency.value=cfg.lfo; lg.gain.value=cfg.gain*0.6;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
    }
    return g;
  }

  function build(code, wind){
    // WMO kodları: 51-67 / 80-82 yağış, 71-77/85-86 qar, 95+ tufan
    var rain = (code>=51&&code<=67)||(code>=80&&code<=82)||code>=95;
    var snow = (code>=71&&code<=77)||code===85||code===86;
    var fog  = code===45||code===48;
    if(rain){
      layer({type:'bandpass',freq:1300,q:0.5,gain:0.055,lfo:0.09});
      layer({type:'lowpass',freq:420,gain:0.035,lfo:0.05});
      if(code>=95) layer({type:'lowpass',freq:110,gain:0.03,lfo:0.02});
    } else if(snow){
      layer({type:'lowpass',freq:260,gain:0.026,lfo:0.03});
    } else if(fog){
      layer({type:'lowpass',freq:180,gain:0.022,lfo:0.02});
    }
    var w=Math.max(0, Math.min(1,(wind||0)/45));
    if(w>0.08) layer({type:'bandpass',freq:240+w*260,q:0.6,gain:0.02+w*0.05,lfo:0.04});
    if(!rain&&!snow&&!fog&&w<=0.08) layer({type:'lowpass',freq:150,gain:0.012,lfo:0.015});
  }

  function start(){
    if(started||!weather) return;
    try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    started=true;
    master=ac.createGain(); master.gain.value=0; master.connect(ac.destination);
    build(weather.code, weather.wind);
    master.gain.linearRampToValueAtTime(0.5, ac.currentTime+6); // ümumi səviyyə çox aşağı
    if(ac.state==='suspended') ac.resume();
  }

  function load(){
    fetch('https://ipapi.co/json/').then(function(r){return r.json();}).then(function(loc){
      if(!loc||!loc.latitude) throw 0;
      return fetch('https://api.open-meteo.com/v1/forecast?latitude='+loc.latitude+'&longitude='+loc.longitude+'&current=weather_code,wind_speed_10m');
    }).then(function(r){return r.json();}).then(function(d){
      var c=d&&d.current;
      weather={code:c?c.weather_code:0, wind:c?c.wind_speed_10m:0};
      start();
    }).catch(function(){ weather={code:0,wind:6}; start(); });
  }

  ['pointerdown','keydown','touchstart'].forEach(function(ev){
    document.addEventListener(ev, function once(){
      document.removeEventListener(ev, once, true);
      if(started){ if(ac&&ac.state==='suspended') ac.resume(); }
      else if(weather) start(); else load();
    }, true);
  });
  load();
})();
</script>
