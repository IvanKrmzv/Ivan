<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recognitio — Ivan</title>
<meta name="description" content="Ivan&#39;ın «Recognitio» romanı — yazılmaqda olan hissə, masa üstü kitab oxu rejimi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-1:#3a2416; --wood-2:#20130a; --wood-grain:rgba(0,0,0,0.35); --wood-sheen:rgba(255,214,150,0.06);
    --leather:#4d1416; --leather-dark:#2c0b0d; --brass:#b98d4a; --brass-bright:#e3bd7d;
    --verdigris:#5f8770; --verdigris-bright:#8ec3a4;
    --paper-1:#f8f1dc; --paper-2:#eee0b8; --paper-3:#e4d3a3; --paper-shadow:rgba(112,84,36,0.35);
    --ink:#2a2316; --ink-dim:#6d6247;
    --text-onink:#ecE4cf; --text-onink-dim:#b0a68c; --line:rgba(236,228,207,0.14); --line-paper:rgba(42,35,22,0.16);
    --serif:'Noto Serif', Georgia, serif;
    --display:'Cormorant Garamond', 'Noto Serif', serif;
    --sans:'Noto Sans', -apple-system, sans-serif;
    --reader-size:1.05rem; --reader-lh:1.82;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--text-onink); font-family:var(--sans);
    background:
      /* warm lamp pool from the candle side */
      radial-gradient(ellipse 80% 55% at 62% -5%, rgba(255,198,116,0.13), transparent 70%),
      radial-gradient(ellipse 120% 90% at 50% 45%, rgba(255,190,120,0.05), transparent 75%),
      /* darkened room corners */
      radial-gradient(ellipse 130% 110% at 50% 55%, transparent 45%, rgba(0,0,0,0.55) 100%),
      /* plank seams */
      repeating-linear-gradient(90deg,
        rgba(0,0,0,0.55) 0px, rgba(0,0,0,0.55) 2px,
        rgba(255,214,150,0.05) 2px, rgba(255,214,150,0.05) 4px,
        transparent 4px, transparent 340px),
      /* fine grain */
      repeating-linear-gradient(91deg, rgba(0,0,0,0.16) 0px, transparent 1px 5px),
      repeating-linear-gradient(89.4deg, rgba(0,0,0,0.10) 0px, transparent 1.5px 11px),
      repeating-linear-gradient(90.6deg, var(--wood-sheen) 0px, transparent 2px 23px),
      /* knots / figuring */
      radial-gradient(ellipse 26px 130px at 18% 32%, rgba(0,0,0,0.30), transparent 70%),
      radial-gradient(ellipse 20px 110px at 74% 68%, rgba(0,0,0,0.26), transparent 70%),
      radial-gradient(ellipse 34px 150px at 43% 82%, rgba(255,206,140,0.06), transparent 70%),
      linear-gradient(178deg, #4a2d19 0%, #35200f 42%, #24140a 78%, #180d05 100%);
    background-attachment:fixed;
    min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  a{color:inherit;} button{font-family:inherit;}
  .visually-hidden{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  button:focus-visible, a:focus-visible{outline:2px solid var(--brass-bright); outline-offset:2px;}

  /* ================= COVER ================= */
  #cover{min-height:100cqh; display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem; text-align:center; position:relative; overflow:hidden;}
  #cover::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:0; background:radial-gradient(ellipse at 50% 20%, rgba(255,196,110,0.10), transparent 62%);}
  #cover::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:0.06; z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='120' viewBox='0 0 240 120'><g fill='none' stroke='%23e9e5d8' stroke-width='1'><rect x='6' y='10' width='10' height='80'/><rect x='30' y='8' width='12' height='82'/><rect x='59' y='6' width='11' height='84'/><rect x='86' y='10' width='13' height='80'/><rect x='116' y='8' width='10' height='82'/><rect x='145' y='10' width='9' height='80'/><rect x='174' y='14' width='8' height='76'/><rect x='200' y='16' width='11' height='74'/><line x1='0' y1='96' x2='240' y2='96'/></g></svg>");
    background-repeat:repeat; background-size:240px 120px;
  }
  .cover-inner{position:relative; z-index:2; max-width:36rem;}
  .cover-seal{width:104px; height:104px; margin:0 auto 1.6rem; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5));}
  .cover-eyebrow{font-family:var(--sans); font-size:0.76rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--verdigris-bright); margin:0 0 1.1rem;}
  .cover-title{font-family:var(--display); font-weight:600; letter-spacing:0.01em; font-size:clamp(3rem,11cqw,5.2rem); margin:0; color:var(--text-onink); text-shadow:0 2px 18px rgba(0,0,0,0.5);}
  .cover-byline{font-family:var(--sans); font-size:0.9rem; color:var(--text-onink-dim); margin:0.85rem 0 0; letter-spacing:0.04em;}
  .cover-epigraph{font-family:var(--display); font-style:italic; font-weight:500; font-size:clamp(1.05rem,2.6cqw,1.3rem); line-height:1.7; color:var(--text-onink-dim); max-width:32em; margin:2.1rem auto 0;}
  .cover-meta{display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap; margin:1.5rem 0 0; font-family:var(--sans); font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-onink-dim);}
  .cover-meta span{border:1px solid var(--line); border-radius:999px; padding:0.32rem 0.85rem; background:rgba(0,0,0,0.15);}
  .cover-start{display:inline-flex; align-items:center; gap:0.6rem; margin-top:2.4rem; font-family:var(--sans); font-weight:600; font-size:1rem; color:#2a1706; background:linear-gradient(180deg, var(--brass-bright), var(--brass)); border:1px solid var(--brass); box-shadow:0 6px 16px rgba(0,0,0,0.35); padding:0.9rem 1.9rem; border-radius:999px; cursor:pointer; transition:transform 0.2s ease, box-shadow 0.2s ease;}
  .cover-start:hover{transform:translateY(-2px); box-shadow:0 9px 20px rgba(0,0,0,0.4);}
  .cover-start:active{transform:translateY(0);}
  .cover-hint{display:block; margin-top:1rem; font-size:0.78rem; color:var(--text-onink-dim);}

  /* ================= READER SHELL ================= */
  #reader{min-height:100cqh; display:flex; flex-direction:column;}
  .reader-bar{
    position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:0.75rem;
    padding:0.85rem clamp(0.9rem,3cqw,1.75rem); background:rgba(20,12,7,0.86); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .bar-btn{display:inline-flex; align-items:center; justify-content:center; width:2.35rem; height:2.35rem; flex:none; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--text-onink-dim); cursor:pointer; transition:border-color 0.2s ease, color 0.2s ease;}
  .bar-btn:hover{color:var(--brass-bright); border-color:var(--brass);}
  .bar-btn svg{width:18px; height:18px;}
  .bar-crumb{flex:1; min-width:0; text-align:center; font-family:var(--display); font-style:italic; font-weight:600; font-size:1.05rem; color:var(--text-onink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-crumb b{color:var(--text-onink); font-style:normal; font-weight:700;}
  .font-controls{display:flex; gap:0.35rem; flex:none;}

  /* ================= DESK STAGE ================= */
  .book-stage{
    flex:1; display:flex; align-items:stretch; justify-content:center; gap:0.15rem;
    padding:clamp(1rem,4cqw,2.5rem) clamp(0.4rem,2cqw,1.5rem) clamp(3.5rem,7cqw,5.5rem);
    position:relative;
  }
  .nav-zone{
    flex:none; width:2.75rem; align-self:center; display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:var(--text-onink-dim); cursor:pointer; border-radius:999px; height:2.75rem;
    transition:color 0.2s ease, background 0.2s ease; position:relative; z-index:12;
  }
  .nav-zone:hover:not(:disabled){color:var(--brass-bright); background:rgba(233,229,216,0.06);}
  .nav-zone:disabled{opacity:0.2; cursor:default;}
  .nav-zone svg{width:22px; height:22px;}

  /* ---- desk surface: the book rests flat on top of it, viewed from above at an angle ---- */
  .desk-surface{
    position:absolute; left:50%; top:0; bottom:0; transform:translateX(-50%);
    width:min(1300px,99%); z-index:1; pointer-events:none; perspective:2200px; perspective-origin:50% 20%;
  }
  .desk-plane{
    position:absolute; left:0; right:0; top:8%; bottom:0; transform-style:preserve-3d;
    transform:rotateX(52deg); transform-origin:50% 0%;
    background:
      radial-gradient(ellipse 70% 45% at 50% 30%, rgba(255,200,130,0.10), transparent 72%),
      repeating-linear-gradient(90deg,
        rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 2px,
        rgba(255,214,150,0.06) 2px, rgba(255,214,150,0.06) 3.5px,
        transparent 3.5px, transparent 300px),
      repeating-linear-gradient(90.4deg, rgba(0,0,0,0.14) 0px, transparent 1px 6px),
      repeating-linear-gradient(89.5deg, rgba(255,205,140,0.05) 0px, transparent 2px 17px),
      linear-gradient(180deg,#5a381e 0%,#40270f 45%,#251405 100%);
    border-radius:0;
    box-shadow:0 40px 70px rgba(0,0,0,0.62);
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 16%, #000 84%, transparent 100%);
    mask-image:linear-gradient(180deg, transparent 0%, #000 16%, #000 84%, transparent 100%);
  }
  .prop-shadow{position:absolute; border-radius:50%; background:radial-gradient(ellipse, rgba(0,0,0,0.55), transparent 72%); transform:translateZ(1px);}

  .desk-prop{position:absolute; transform-style:preserve-3d;}
  .cup-corner{
    position:absolute; right:clamp(0.2rem,1.6cqw,1.4rem); bottom:clamp(3.4rem,7cqw,5.2rem);
    width:clamp(96px,11cqw,158px); z-index:13; pointer-events:none;
    perspective:600px; perspective-origin:50% 30%;
  }
  .cup-corner .prop-cup{position:relative; width:100%; transform:rotateX(9deg); transform-style:preserve-3d;
    filter:drop-shadow(0 16px 18px rgba(0,0,0,0.55));}
  .cup-corner .cup-floor{
    position:absolute; left:6%; right:6%; bottom:-2%; height:16px; border-radius:50%;
    background:radial-gradient(ellipse, rgba(0,0,0,0.55), transparent 72%); filter:blur(2px);
  }
  @container (max-width:640px){ .cup-corner{display:none;} }
  .cup-corner{transition:opacity 0.5s ease, transform 0.5s ease;}
  .cup-corner.gone{opacity:0; transform:translateY(16px) scale(0.96); pointer-events:none;}
  .pour-pot.gone{opacity:0 !important; pointer-events:none;}
  @container (max-width:1000px){
    .desk-surface{width:100%;}

  }
  @container (max-width:640px){
    .desk-surface{display:none;}
  }

  /* ---- candle: fixed 3D ornament, top-right of the stage, always visible ---- */
  .candle-corner{
    position:absolute; top:0.4rem; right:clamp(0.5rem,2cqw,2rem); z-index:14; width:clamp(34px,5cqw,54px);
    transform:perspective(300px) rotateY(-14deg) rotateX(4deg); transform-origin:bottom center;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,0.5));
    pointer-events:none;
  }
  .flame{transform-origin:50% 100%; animation:flicker 2.6s ease-in-out infinite;}
  @keyframes flicker{
    0%,100%{transform:scaleY(1) rotate(0deg); opacity:1;}
    25%{transform:scaleY(1.06) rotate(-2deg); opacity:0.96;}
    50%{transform:scaleY(0.94) rotate(2deg); opacity:1;}
    75%{transform:scaleY(1.03) rotate(-1deg); opacity:0.95;}
  }
  .steam{opacity:0; animation:steam 3.6s ease-in infinite;}
  .steam.s2{animation-delay:1.1s;} .steam.s3{animation-delay:2.2s;}
  @keyframes steam{
    0%{opacity:0; transform:translateY(0) translateX(0) scaleX(1);}
    15%{opacity:0.55;} 75%{opacity:0.18;}
    100%{opacity:0; transform:translateY(-34px) translateX(6px) scaleX(1.6);}
  }

  /* ---- tea cup: sits still until picked up and sipped, on an interval, with a hand ---- */
  .prop-cup .cup-hand{opacity:0; transform:translateY(18px); transform-origin:bottom center;}
  .prop-cup .cup-body{transform-origin:50% 90%;}
  .prop-cup.sipping .cup-hand{animation:hand-in-out 3.4s ease-in-out;}
  .prop-cup.sipping .cup-body{animation:cup-lift 3.4s ease-in-out;}
  .prop-cup.sipping .steam{animation:none; opacity:0;}
  @keyframes hand-in-out{
    0%{opacity:0; transform:translateY(18px);}
    18%,72%{opacity:1; transform:translateY(0);}
    100%{opacity:0; transform:translateY(18px);}
  }
  @keyframes cup-lift{
    0%{transform:translate3d(0,0,0) rotate(0deg) scale(1);}
    16%{transform:translate3d(-4px,-26px,40px) rotate(-4deg) scale(1.03);}
    /* pulled back toward the reader and tipped up for the sip */
    30%,58%{transform:translate3d(-16px,-64px,90px) rotate(-19deg) scale(0.93);}
    40%{transform:translate3d(-17px,-68px,92px) rotate(-24deg) scale(0.93);}
    50%{transform:translate3d(-16px,-64px,90px) rotate(-20deg) scale(0.93);}
    76%{transform:translate3d(-3px,-18px,30px) rotate(-3deg) scale(1.02);}
    100%{transform:translate3d(0,0,0) rotate(0deg) scale(1);}
  }
  .prop-cup .cup-tea{transform-origin:50% 100%; transition:opacity 0.4s ease;}
  .prop-cup.sipping .cup-tea{animation:tea-drain 3.4s ease-in-out;}
  @keyframes tea-drain{
    0%,24%{transform:scaleY(1);}
    56%{transform:scaleY(0.74);}
    100%{transform:scaleY(0.74);}
  }

  /* ================= BOOK — lying flat on the desk, viewed from above ================= */
  .book-wrap{
    flex:1; max-width:960px; perspective:2200px; perspective-origin:50% 15%;
    display:flex; align-items:center; justify-content:center; position:relative; z-index:3;
  }
  .book{position:relative; width:100%; height:min(72cqh,620px); display:flex; transform:rotateX(34deg); transform-style:preserve-3d; transform-origin:50% 85%;}
  .book-shadow{position:absolute; left:2%; right:2%; bottom:-1.6rem; height:2.6rem; background:radial-gradient(ellipse at center, rgba(0,0,0,0.62), transparent 72%); filter:blur(3px); z-index:0;}
  @container (max-width:640px){
    .book{transform:rotateX(16deg);}
  }

  .pages{position:relative; flex:1; display:flex; z-index:5; border-radius:4px; overflow:visible; box-shadow:0 2rem 3.5rem rgba(0,0,0,0.55), 0 0.3rem 0.8rem rgba(0,0,0,0.35);}
  .page{
    position:relative; flex:0 0 50%; width:50%; min-width:0;
    background:
      /* aged foxing spots — uneven, never a flat single texture */
      radial-gradient(ellipse 34% 22% at 14% 18%, rgba(150,112,52,0.13), transparent 68%),
      radial-gradient(ellipse 26% 18% at 84% 72%, rgba(150,112,52,0.11), transparent 66%),
      radial-gradient(ellipse 18% 14% at 68% 22%, rgba(126,94,40,0.07), transparent 70%),
      radial-gradient(ellipse 22% 16% at 30% 84%, rgba(126,94,40,0.06), transparent 72%),
      /* edge tanning: outer edges yellower than the middle */
      linear-gradient(90deg, rgba(158,120,54,0.16) 0%, transparent 14%, transparent 86%, rgba(158,120,54,0.16) 100%),
      linear-gradient(180deg, rgba(158,120,54,0.14) 0%, transparent 12%, transparent 88%, rgba(158,120,54,0.13) 100%),
      /* laid-paper fibres */
      repeating-linear-gradient(96deg, rgba(120,92,44,0.045) 0px, transparent 1px 4px),
      repeating-linear-gradient(6deg, rgba(120,92,44,0.035) 0px, transparent 1px 7px),
      linear-gradient(118deg, #faf4e2 0%, #f4ead0 46%, #ecdfbd 78%, #e3d3a8 100%);
    background-blend-mode:multiply,multiply,multiply,multiply,multiply,multiply,normal,normal,normal;
    color:var(--ink);
    padding:clamp(1.4rem,4cqw,3.1rem) clamp(1.3rem,4cqw,2.9rem);
    overflow:hidden; display:flex; flex-direction:column;
  }
  .page.single{flex:1 1 100%; width:100%;}
  .page > .grain{
    position:absolute; inset:0; pointer-events:none; z-index:1; opacity:0.5; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='170' height='170' filter='url(%23n)' opacity='0.34'/></svg>");
    background-size:170px 170px;
  }
  .page > *:not(.grain){position:relative; z-index:2;}
  .page.left{border-radius:4px 0 0 4px; box-shadow:inset -20px 0 30px -24px var(--paper-shadow);}
  .page.right{border-radius:0 4px 4px 0; box-shadow:inset 20px 0 30px -24px var(--paper-shadow);}
  .page.single{border-radius:4px; box-shadow:inset 0 0 40px -18px var(--paper-shadow);}
  /* center gutter shadow instead of a bulky spine element */
  .pages::before{
    content:""; position:absolute; top:0; bottom:0; left:50%; width:26px; margin-left:-13px; z-index:8;
    background:linear-gradient(90deg, transparent, rgba(20,12,6,0.28) 45%, rgba(20,12,6,0.28) 55%, transparent);
    pointer-events:none;
  }
  @container (max-width:899px){ .pages::before{display:none;} }

  .page::before{ /* deckle / stacked-paper edge on outer sides */
    content:""; position:absolute; top:2px; bottom:2px; width:7px;
    background:repeating-linear-gradient(180deg, rgba(42,35,22,0.12) 0px, rgba(42,35,22,0.12) 1px, transparent 1px, transparent 3px), linear-gradient(90deg, rgba(180,150,90,0.35), transparent);
  }
  .page.left::before{left:-7px; border-radius:2px 0 0 2px;}
  .page.right::before{right:-7px; transform:scaleX(-1); border-radius:0 2px 2px 0;}
  .page.single::before, .page.single::after{
    content:""; position:absolute; top:2px; bottom:2px; width:7px;
    background:repeating-linear-gradient(180deg, rgba(42,35,22,0.12) 0px, rgba(42,35,22,0.12) 1px, transparent 1px, transparent 3px), linear-gradient(90deg, rgba(180,150,90,0.35), transparent);
  }
  .page.single::before{left:-7px;}
  .page.single::after{right:-7px; transform:scaleX(-1);}

  .page-num{margin-top:auto; padding-top:1rem; text-align:center; font-family:var(--display); font-style:italic; font-size:0.85rem; color:var(--ink-dim);}
  .page-heading{margin:0 0 1.3rem; text-align:center;}
  .page-heading .eyebrow{font-family:var(--sans); font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:#3f6b52; margin:0 0 0.5rem;}
  .page-heading h2{font-family:var(--display); font-weight:700; margin:0; font-size:clamp(1.3rem,4cqw,1.85rem); color:var(--ink);}
  .page-heading .rule{width:46px; height:2px; background:var(--brass); border:none; margin:1.05rem auto 0; border-radius:2px;}
  .season-title-page{flex:1; display:flex; align-items:center; justify-content:center; text-align:center; flex-direction:column;}
  .season-title-page .eyebrow{font-family:var(--sans); font-size:0.76rem; letter-spacing:0.22em; text-transform:uppercase; color:#3f6b52; margin:0 0 1rem;}
  .season-title-page h1{font-family:var(--display); font-weight:700; font-size:clamp(1.8rem,6cqw,2.7rem); margin:0; color:var(--ink);}
  .season-title-page .rule{width:64px; height:2px; background:var(--brass); border:none; border-radius:2px; margin:1.4rem 0;}

  .page-body{font-family:var(--serif); font-size:var(--reader-size); line-height:var(--reader-lh);
    text-align:justify; text-justify:inter-word; hyphens:auto; -webkit-hyphens:auto;}
  .page-body p.divider, .page-body p:first-child{text-align:justify;}
  .page-body p{margin:0 0 1.02em;}
  .page-body p:last-child{margin-bottom:0;}
  .page-body p.thought{font-style:italic; color:var(--ink-dim);}
  .page-body p.divider{text-align:center; font-family:var(--sans); font-style:normal; font-size:0.7rem; letter-spacing:0.16em; text-transform:uppercase; color:#7a6a45; margin:1.35em 0; position:relative;}
  .page-body p.divider::before, .page-body p.divider::after{content:""; display:inline-block; width:28px; height:1px; background:var(--line-paper); vertical-align:middle; margin:0 0.7em;}
  .blank-leaf{flex:1; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-family:var(--display); font-style:italic; opacity:0.5;}

  @container (max-width:899px){ .page.left{display:none;} }
  @container (min-width:900px){ .page.single{display:none;} }

  /* ---- flip overlay leaf (real single-page turn) ---- */
  .flip-leaf{
    position:absolute; top:0; bottom:0; z-index:20; transform-style:preserve-3d;
    transition:transform 0.72s cubic-bezier(.45,.1,.2,1); pointer-events:none;
    box-shadow:0 10px 40px rgba(0,0,0,0.45);
  }
  .flip-leaf.slot-right{right:0; width:50%; transform-origin:left center;}
  .flip-leaf.slot-left{left:0; width:50%; transform-origin:right center;}
  .flip-leaf.slot-full{left:0; width:100%; }
  .flip-leaf.slot-full.dir-next{transform-origin:left center;}
  .flip-leaf.slot-full.dir-prev{transform-origin:right center;}
  .flip-leaf.animate.slot-right{transform:rotateY(-179.5deg);}
  .flip-leaf.animate.slot-left{transform:rotateY(179.5deg);}
  .flip-leaf.animate.slot-full.dir-next{transform:rotateY(-179.5deg);}
  .flip-leaf.animate.slot-full.dir-prev{transform:rotateY(179.5deg);}
  .flip-face{position:absolute; inset:0; backface-visibility:hidden; overflow:hidden; display:flex;}
  .flip-face .page{width:100%; flex:1 1 100%;}
  .flip-face::after{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg, rgba(0,0,0,0.14), transparent 20%, transparent 80%, rgba(0,0,0,0.08));}

  @media (prefers-reduced-motion:reduce){
    .flip-leaf{transition:opacity 0.25s ease !important; transform:none !important;}
  }

  /* ================= FOOTER ================= */
  .reader-footer{padding:0.75rem clamp(0.9rem,3cqw,1.75rem) calc(0.9rem + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:rgba(20,12,7,0.86);}
  .progress-track{height:3px; border-radius:3px; background:var(--line); overflow:hidden; margin-bottom:0.65rem;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--verdigris), var(--brass)); width:0%; transition:width 0.3s ease;}

  .footer-nav{display:flex; gap:0.5rem;}

  .footer-nav button:hover:not(:disabled){border-color:var(--brass); color:var(--brass-bright);}
  .footer-nav button:disabled{opacity:0.3; cursor:default;}
  .footer-nav svg{width:16px; height:16px;}

  /* ================= TOC PANEL ================= */
  #tocScrim{position:fixed; inset:0; background:rgba(10,6,4,0.6); z-index:34; opacity:0; pointer-events:none; transition:opacity 0.25s ease;}
  #tocScrim.open{opacity:1; pointer-events:auto;}
  #tocPanel{position:fixed; top:0; bottom:0; left:0; width:min(86cqw, 340px); background:#1a100a; border-right:1px solid var(--line); z-index:35; transform:translateX(-105%); transition:transform 0.3s ease; display:flex; flex-direction:column; padding:1.25rem 0;}
  #tocPanel.open{transform:translateX(0);}

  .toc-list li a:hover{color:var(--brass-bright); background:rgba(233,229,216,0.04);}

  @container (max-width:640px){

  /* =========================================================
     ADDITIONS: big realistic candle + candle-based lighting,
     ashtray & cigarettes, worn pages, smooth drink, props UI
     ========================================================= */

  /* ---- candle-driven lighting -------------------------------------- */
  :root{ --cx:78%; --cy:12%; --lr:26vmax; --lint:1; }
  .light-layer{position:fixed; inset:0; pointer-events:none; z-index:26;}
  /* qaranlıq: yalnız şamın ətrafı görünür, qalanı dərin qaranlıq */
  #lightDark{
    background:radial-gradient(circle var(--lr) at var(--cx) var(--cy),
      rgba(255,244,224,1) 0%,
      rgba(226,197,158,1) 12%,
      rgba(150,120,86,1) 26%,
      rgba(74,56,38,1) 44%,
      rgba(28,20,13,1) 64%,
      rgba(8,6,4,1) 85%,
      rgba(4,3,2,1) 100%);
    mix-blend-mode:multiply; opacity:calc(0.96 * var(--lint));
  }
  /* isti şam işığı: nüvə → amber → dərin narıncı hal */
  #lightWarm{
    background:
      radial-gradient(circle calc(var(--lr) * 0.16) at var(--cx) var(--cy),
        rgba(255,232,182,0.7), rgba(255,190,104,0.3) 60%, transparent 100%),
      radial-gradient(circle calc(var(--lr) * 0.62) at var(--cx) var(--cy),
        rgba(255,172,80,0.34) 0%, rgba(255,138,46,0.14) 45%, rgba(196,92,24,0.04) 74%, transparent 90%);
    mix-blend-mode:screen; opacity:calc(0.95 * var(--lint));
    animation:lamp-breathe 5.4s ease-in-out infinite, flame-flicker 2.3s steps(1,end) infinite;
  }

  @keyframes lamp-breathe{0%,100%{filter:brightness(1);}45%{filter:brightness(1.1) saturate(1.05);}70%{filter:brightness(0.93);}}
  @keyframes flame-flicker{
    0%,100%{opacity:calc(0.95 * var(--lint));}
    17%{opacity:calc(0.88 * var(--lint));}
    31%{opacity:calc(1 * var(--lint));}
    52%{opacity:calc(0.91 * var(--lint));}
    68%{opacity:calc(0.98 * var(--lint));}
    84%{opacity:calc(0.9 * var(--lint));}
  }
  @media (prefers-reduced-motion:reduce){ #lightWarm{animation:none;} }
  /* on the cover the candle lighting shouldn't dim the artwork */
  body:not(.reading) #lightDark{opacity:0.16;}
  body:not(.reading) #lightWarm{opacity:0.5;}


  /* ---- candle: bigger, realistic, draggable ------------------------- */
  .candle-corner{
    width:clamp(64px,8.5cqw,104px) !important;
    top:0.2rem;
    pointer-events:auto !important;
    cursor:grab; touch-action:none;
    filter:drop-shadow(0 18px 22px rgba(0,0,0,0.6));
    transition:filter 0.2s ease;
  }
  .candle-corner:active{cursor:grabbing;}
  .candle-corner.dragging{filter:drop-shadow(0 24px 30px rgba(0,0,0,0.7));}
  .candle-corner .halo{
    position:absolute; left:50%; top:6%; width:340%; padding-bottom:340%;
    transform:translate(-50%,-52%); border-radius:50%; pointer-events:none; z-index:-1;
    background:radial-gradient(circle, rgba(255,196,108,0.30), rgba(255,160,60,0.12) 38%, transparent 68%);
    animation:halo-flicker 3.1s ease-in-out infinite;
  }
  @keyframes halo-flicker{0%,100%{opacity:0.95; transform:translate(-50%,-52%) scale(1);}
    30%{opacity:0.78; transform:translate(-50%,-52%) scale(0.96);}
    62%{opacity:1; transform:translate(-50%,-52%) scale(1.04);}}
  .flame-core{transform-origin:50% 100%; animation:flame-dance 2.2s ease-in-out infinite;}
  .flame-outer{transform-origin:50% 100%; animation:flame-dance 2.9s ease-in-out infinite reverse;}
  @keyframes flame-dance{
    0%,100%{transform:scale(1,1) skewX(0deg);}
    20%{transform:scale(0.96,1.07) skewX(-3deg);}
    45%{transform:scale(1.05,0.94) skewX(2.5deg);}
    70%{transform:scale(0.98,1.04) skewX(-1.5deg);}
  }
  @media (prefers-reduced-motion:reduce){
    .flame-core,.flame-outer,.halo{animation:none;}
  }
  @container (max-width:640px){ .candle-corner{width:56px !important;} }

  /* ---- ashtray, top-left ------------------------------------------- */
  .ashtray-corner{
    position:absolute; top:0.6rem; left:clamp(0.4rem,2cqw,2.2rem); z-index:13;
    width:clamp(88px,11cqw,150px); pointer-events:none;
    transform:perspective(520px) rotateX(16deg);
    filter:drop-shadow(0 14px 18px rgba(0,0,0,0.55));
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  .ashtray-corner.gone{opacity:0; transform:perspective(520px) rotateX(16deg) translateY(14px) scale(0.96);}
  .ashtray-corner.gone .cig-smoke{display:none;}
  .cig-smoke{opacity:0; animation:cig-rise 5.2s ease-in infinite;}
  .cig-smoke.c2{animation-delay:2.4s; animation-duration:6.1s;}
  @keyframes cig-rise{
    0%{opacity:0; transform:translateY(0) translateX(0) scaleX(0.7);}
    18%{opacity:0.4;} 70%{opacity:0.14;}
    100%{opacity:0; transform:translateY(-40px) translateX(9px) scaleX(1.9);}
  }
  .cig-ember{animation:ember 3.4s ease-in-out infinite;}
  @keyframes ember{0%,100%{opacity:0.75;}50%{opacity:1;}}
  @container (max-width:900px){ .ashtray-corner{display:none;} }

  /* ---- worn paper: creases & stains --------------------------------- */
  .page > .marks{
    position:absolute; inset:0; pointer-events:none; z-index:3;
    mix-blend-mode:multiply; opacity:0.9;
  }
  .page > .marks .sheen{
    position:absolute; inset:0; mix-blend-mode:soft-light; opacity:0.3;
    -webkit-mask-image:radial-gradient(ellipse 88% 88% at 50% 50%, #000 25%, transparent 88%);
    mask-image:radial-gradient(ellipse 88% 88% at 50% 50%, #000 25%, transparent 88%);
  }

  /* ---- smooth liquid + straw ---------------------------------------- */
  .prop-cup.sipping .cup-tea{animation:none !important;}
  .prop-cup .cup-tea{
    transition:transform 1.6s cubic-bezier(.33,.02,.24,1), opacity 0.8s ease;
    will-change:transform;
  }
  .prop-cup.no-lift.sipping .cup-body{animation:none !important;}
  .prop-cup.no-lift.sipping .cup-hand{animation:none !important; opacity:0 !important;}
  #cupStraw{opacity:0; transition:opacity 0.35s ease; transform-origin:62% 100%;}
  #cupStraw.on{opacity:1;}
  #cupStraw.drinking{animation:straw-nudge 2.6s ease-in-out;}
  @keyframes straw-nudge{
    0%,100%{transform:rotate(0deg) translateY(0);}
    22%{transform:rotate(-2.2deg) translateY(1.5px);}
    52%{transform:rotate(1.8deg) translateY(-1px);}
    78%{transform:rotate(-1deg) translateY(0.6px);}
  }

  /* ---- refill: pot pours in from the side ---------------------------- */
  .pour-pot{
    position:absolute; right:clamp(2.5rem,7.5cqw,7rem); bottom:clamp(8.5rem,15cqw,13rem);
    width:clamp(92px,11cqw,150px); z-index:15; pointer-events:none;
    opacity:0; transform:translateX(-70px) rotate(0deg);
    transition:opacity 0.5s ease, transform 0.9s cubic-bezier(.3,.05,.2,1);
    filter:drop-shadow(0 12px 16px rgba(0,0,0,0.5));
  }
  .pour-pot.in{opacity:1; transform:translateX(0) rotate(0deg);}
  .pour-pot.tilt{transform:translateX(0) rotate(30deg);}
  .pour-stream{opacity:0; transition:opacity 0.25s ease;}
  .pour-pot.tilt .pour-stream{opacity:1; animation:stream-wobble 0.5s linear infinite;}
  @keyframes stream-wobble{0%,100%{transform:translateX(0);}50%{transform:translateX(1.2px);}}
  @container (max-width:640px){ .pour-pot{display:none;} }

  /* ---- prop controls: left side, larger, softly visible --------------- */
  .prop-controls{
    position:absolute; left:clamp(0.4rem,1.6cqw,1.25rem); bottom:clamp(0.5rem,2cqw,1.5rem);
    z-index:22; display:flex; flex-direction:column; gap:0.5rem; align-items:flex-start;
    opacity:0.62; transition:opacity 0.3s ease;
  }
  .prop-controls:hover, .prop-controls:focus-within{opacity:1;}
  .prop-btn{
    width:2.7rem; height:2.7rem; display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%; border:1px solid rgba(185,141,74,0.6); background:rgba(28,17,9,0.7);
    color:var(--brass-bright); cursor:pointer; padding:0; line-height:1;
    box-shadow:0 3px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,214,150,0.12);
    transition:background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    backdrop-filter:blur(4px);
  }
  .prop-btn svg{width:21px; height:21px;}
  .prop-btn:hover{background:rgba(72,44,19,0.88); border-color:var(--brass-bright); transform:translateY(-2px);}
  .prop-btn.active{background:rgba(95,135,112,0.4); border-color:var(--verdigris-bright); color:var(--verdigris-bright);}
  .prop-note{
    position:absolute; left:3.2rem; bottom:0; white-space:nowrap; pointer-events:none;
    font-family:var(--sans); font-size:0.78rem; letter-spacing:0.04em; color:var(--text-onink);
    background:rgba(20,12,7,0.88); border:1px solid var(--line); border-radius:999px;
    padding:0.32rem 0.75rem; opacity:0; transition:opacity 0.25s ease;
  }
  .prop-note.show{opacity:1;}
  @container (max-width:640px){ .prop-controls{opacity:0.7; gap:0.4rem;} .prop-btn{width:2.35rem; height:2.35rem;} .prop-btn svg{width:18px;height:18px;} }

  /* ---- candle hint bubble -------------------------------------------- */
  .candle-tip{
    position:absolute; left:50%; top:calc(100% + 0.55rem); transform:translate(-50%,6px);
    white-space:nowrap; font-family:var(--sans); font-size:0.72rem; letter-spacing:0.03em;
    color:#ffe6bd; background:rgba(32,19,9,0.9); border:1px solid rgba(185,141,74,0.6);
    border-radius:999px; padding:0.34rem 0.7rem; pointer-events:none; opacity:0;
    box-shadow:0 6px 16px rgba(0,0,0,0.45); transition:opacity 0.45s ease, transform 0.45s ease;
    z-index:5;
  }
  .candle-tip.show{opacity:1; transform:translate(-50%,0); animation:tip-pulse 2.6s ease-in-out infinite;}
  .candle-tip.tip-right{left:auto; right:-0.2rem; transform:translate(0,6px);}
  .candle-tip.tip-right.show{transform:translate(0,0);}
  @keyframes tip-pulse{0%,100%{box-shadow:0 6px 16px rgba(0,0,0,0.45);}50%{box-shadow:0 6px 22px rgba(255,180,90,0.35);}}
  @container (max-width:640px){ .candle-tip{font-size:0.64rem; white-space:normal; width:9.5rem; text-align:center;} }


  /* ---- cover: warmer, livelier ---------------------------------------- */
  #cover::before{
    background:
      radial-gradient(ellipse 70% 55% at 50% 16%, rgba(255,196,110,0.24), transparent 66%),
      radial-gradient(ellipse 60% 50% at 12% 88%, rgba(95,135,112,0.20), transparent 70%),
      radial-gradient(ellipse 55% 45% at 90% 78%, rgba(185,141,74,0.20), transparent 72%);
    animation:cover-breathe 9s ease-in-out infinite;
  }
  #cover::after{opacity:0.12;}
  @keyframes cover-breathe{0%,100%{opacity:0.9;}50%{opacity:1;}}
  .cover-seal{filter:drop-shadow(0 4px 14px rgba(255,180,90,0.35)) drop-shadow(0 4px 10px rgba(0,0,0,0.5)); animation:seal-glow 6s ease-in-out infinite;}
  @keyframes seal-glow{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-4px) scale(1.02);}}
  .cover-title{
    background:linear-gradient(180deg,#fff4dd,#f3d9a4 55%,#c99a52);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:none; filter:drop-shadow(0 4px 22px rgba(255,170,80,0.28));
  }
  .cover-eyebrow{color:#8fc3a5;}
  .cover-byline{color:#e8d9bd;}
  .cover-epigraph{color:#ddcdb1;}
  .cover-meta{color:#cbb997;}
  .cover-meta span{background:rgba(255,196,110,0.08); border-color:rgba(185,141,74,0.45);}
  .cover-hint{color:#c6b394;}
  .cover-start{box-shadow:0 8px 24px rgba(255,170,80,0.28), 0 6px 16px rgba(0,0,0,0.4);}
  .cover-inner > *{animation:cover-rise 0.9s cubic-bezier(.2,.7,.2,1) both;}
  .cover-inner > *:nth-child(2){animation-delay:0.08s;}
  .cover-inner > *:nth-child(3){animation-delay:0.16s;}
  .cover-inner > *:nth-child(4){animation-delay:0.24s;}
  .cover-inner > *:nth-child(5){animation-delay:0.32s;}
  .cover-inner > *:nth-child(6){animation-delay:0.4s;}
  .cover-inner > *:nth-child(7){animation-delay:0.48s;}
  @keyframes cover-rise{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){
    #cover::before,.cover-seal,.cover-inner > *,.candle-tip.show{animation:none;}
  }



  /* ===== landscape stage: mobil cihazda kompüter görünüşü ===== */
  html,body{height:100%; overflow:hidden;}
  #rotor{
    position:fixed; top:50%; left:50%; transform-origin:50% 50%;
    container-type:size; overflow-y:auto; overflow-x:hidden;
    background:inherit; -webkit-overflow-scrolling:touch;
  }
  #rotateHint{
    position:fixed; z-index:9999; left:50%; bottom:1.1rem; transform:translateX(-50%);
    font-family:var(--sans); font-size:0.78rem; letter-spacing:0.04em;
    color:var(--text-onink); background:rgba(20,12,7,0.9); border:1px solid var(--line);
    padding:0.55rem 0.95rem; border-radius:999px; pointer-events:none;
    opacity:0; transition:opacity 0.4s ease;
  }
  #rotateHint.show{opacity:1;}

  /* ============================================================
     GECƏ REJİMİ — dərin qaranlıq otaq + realistik şam işığı
     ============================================================ */
  :root{
    --lr:26vmax;          /* şamın işıq radiusu */
    --lint:1;             /* canlı alov intensivliyi (JS ilə dəyişir) */
    --flick:1;            /* ani titrəyiş */
    --breath:1;           /* yavaş nəfəs: işıq bəzən zəifləyir, bəzən güclənir */
    --melt:0;             /* şamın çox yavaş əriməsi (SVG vahidi) */
  }


  /* Otağın özü daha qaranlıq: taxta masa artıq günəş altında deyil */
  body.reading::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:25;
    background:radial-gradient(ellipse 120% 100% at var(--cx) var(--cy),
      rgba(0,0,0,0) 0%, rgba(0,0,0,0.42) 38%, rgba(0,0,0,0.86) 82%, rgba(0,0,0,0.93) 100%);
  }

  /* Qaranlıq maskası: yalnız şamın radiusu daxilində rahat oxunur,
     kənarlar çətinliklə seçilir, tam qara deyil */
  body.reading #lightDark{
    opacity:1;
    background:radial-gradient(circle calc(var(--lr) * var(--flick) * var(--breath)) at var(--cx) var(--cy),
      rgba(255,238,208,1) 0%,
      rgba(252,224,182,1) 14%,
      rgba(224,176,120,1) 28%,
      rgba(140,92,52,1) 42%,
      rgba(64,38,20,1) 56%,
      rgba(26,15,9,1) 70%,
      rgba(13,8,5,1) 84%,
      rgba(8,5,3,1) 100%);
  }

  /* İsti şam işığı — qırmızımtıl-narıncı nüvə, hale və uzaq mis yayılma */
  body.reading #lightWarm{
    animation:none;
    opacity:calc(0.98 * var(--lint) * var(--breath));
    background:
      radial-gradient(circle calc(var(--lr) * 0.10 * var(--flick) * var(--breath)) at var(--cx) var(--cy),
        rgba(255,226,170,0.85), rgba(255,168,86,0.44) 60%, transparent 100%),
      radial-gradient(circle calc(var(--lr) * 0.42 * var(--flick) * var(--breath)) at var(--cx) var(--cy),
        rgba(255,138,56,0.36) 0%, rgba(238,96,30,0.18) 52%, transparent 88%),
      radial-gradient(circle calc(var(--lr) * 0.95 * var(--flick) * var(--breath)) at var(--cx) var(--cy),
        rgba(214,80,26,0.15) 0%, rgba(150,48,12,0.06) 55%, transparent 92%);
    filter:brightness(calc((0.9 + 0.16 * var(--flick)) * var(--breath))) saturate(1.15);
  }

  /* Səhifə kağızı şam işığında: soyuq ağ yox, isti mum rəngi */
  body.reading .page{ filter:saturate(1.1) brightness(calc(0.97 * var(--breath))) sepia(0.06); }

  /* Alov halesi — canlı titrəyiş JS-dən gəlir */
  .candle-corner .halo{
    animation:none;
    width:420%; padding-bottom:420%;
    background:radial-gradient(circle,
      rgba(255,196,120,0.44) 0%,
      rgba(255,140,54,0.22) 32%,
      rgba(226,74,20,0.09) 55%,
      transparent 74%);

    opacity:calc(0.8 + 0.3 * var(--flick));
    transform:translate(-50%,-52%) scale(var(--flick));
  }
  .flame-core{animation:flame-dance 1.55s ease-in-out infinite;}
  .flame-outer{animation:flame-dance 2.1s ease-in-out infinite reverse;}
  @keyframes flame-dance{
    0%,100%{transform:scale(1,1) skewX(0deg) translateY(0);}
    12%{transform:scale(0.94,1.10) skewX(-4deg) translateY(-0.6px);}
    27%{transform:scale(1.04,0.95) skewX(3deg) translateY(0.3px);}
    41%{transform:scale(0.97,1.06) skewX(-2deg) translateY(-0.4px);}
    58%{transform:scale(1.06,0.92) skewX(4.5deg) translateY(0.5px);}
    73%{transform:scale(0.95,1.08) skewX(-3deg) translateY(-0.3px);}
    88%{transform:scale(1.02,0.97) skewX(1.5deg) translateY(0);}
  }

<script>

  window.__MOBILE_CANDLE = (function(){
    try{
      return window.matchMedia('(pointer:coarse)').matches
        || (navigator.maxTouchPoints || 0) > 0
        || window.matchMedia('(max-width:820px)').matches;
    }catch(e){ return false; }
  })();
  document.addEventListener('DOMContentLoaded', function(){
    if(!window.__MOBILE_CANDLE) return;
    document.documentElement.classList.add('static-candle');
    var c = document.getElementById('candleProp');
    if(c) c.removeAttribute('title');
    var t = document.getElementById('candleTip');
    if(t && t.parentNode) t.parentNode.removeChild(t);

  @keyframes ember-flicker{0%,100%{filter:drop-shadow(0 0 12px rgba(255,120,20,0.55)); opacity:1;}

<script id="pagesData" type="application/json">[{"season_num": null, "season_title": null, "chapter_num": "1", "chapter_title": "4 aprel 1982", "heading": {"kind": "chapter", "num": "1", "title": "4 aprel 1982"}, "paras": [{"cls": "p", "text": "Zaldakı hündür pəncərələrdən süzülən solğun gün işığı, havada asılı qalmış toz dənəciklərini yavaş-yavaş fırladırdı, sanki onlar da mənim kimi hara getdiklərini bilmirdilər. Hakim taxta çəkici yenidən masaya endirdi. Səsin qulağımda yaratdığı əks-səda başımın içindəki o daimi darısqallıqda bir neçə dəfə fırfıra kimi fırlanıb sözsüz söndü. Mən arxa sıralardan birində, taxta skamyanın soyuq kənarında büzüşüb oturmuşdum, dizlərimin üstündə köhnə, cildi aşınmış bir dəftər var idi - nə vaxt əlimə aldığımı xatırlamırdım, amma barmaqlarım artıq onun künclərini əzmişdi."}, {"cls": "p", "text": "– Təqsirləndirilən şəxs, – dedi kürsüdə oturan yaşlı kişi. Səsi uzaqdan, elə bil suyun altından gəlirdi, hər hərf bir pərdənin arxasından süzülüb mənə çatırdı. – Son sözünüz nədir?"}], "wc": 104}, {"season_num": null, "season_title": null, "chapter_num": "1", "chapter_title": "4 aprel 1982", "heading": null, "paras": [{"cls": "p", "text": "Başımı qaldırıb kürsüdə dayanmış o adama baxdım. Üzünü tam görə bilmirdim, işıq elə düşmüşdü ki, cizgiləri bir-birinə qarışırdı, amma bunun heç bir əhəmiyyəti yox idi, çünki içimdəki o qatı, boğucu nifrət bütün bədənimi zəhərləməyə artıqlaması ilə bəs edirdi. Mənim tək varlığımı, dünyamı, nəfəsimi əlimdən alan, həyatımı bir andaca məhv edən, hər səhər oyananda yaddaşımın o qaranlıq boşluğunda çırpınmağıma səbəb olan o alçaq məhz orada, o kürsüdə dayanıb, sakit, tərpənməz, sanki heç nə olmayıbmış kimi. Zalda oturan hər kəs ona nifrətlə baxırdı, hiss edirdim bunu kürəyimlə, ətrafımdakı nəfəslərin ağırlığından, amma mənim içimdəki qəzəb bütün zalın qəzəbini bir andaca üstələyib özününküləşdirirdi. Necə qıydın? Mənim məsum uşağıma o zülmü necə rəva bildin, hansı haqla?"}], "wc": 111}, {"season_num": null, "season_title": null, "chapter_num": "1", "chapter_title": "4 aprel 1982", "heading": null, "paras": [{"cls": "p", "text": "Əynimdəki pencəyin düymələri yenə səhv bağlanmışdı, biri boş qalmışdı, deyəsən heç vaxt öyrənə bilməyəcəkdim. Barmaqlarım qəzəbdən və görünməz bir titrəməkdən bükülmürdü, sanki sümüklərim özlərini mənə tabe etdirmək istəmirdi. Cibimə əlimi atanda sərt bir kağız parçasına toxundum. Zaldakı o gənc vəkil, keçən dəqiqələrdə yanımdan ötərkən, heç kəsin gözünə dəymədən, sürətlə cibimə soxmuşdu onu. Çıxarıb açdım, hərflər əvvəl bir-birinə qarışdı, sonra yavaş-yavaş yerinə oturdu: \"Heç nədən xəbərin yoxdur, bilirəm. Bu qapıdan çıxanda hər şeyi yenidən unudacaqsan, amma qatili tapmaq üçün izlər həmişə səninlə qalacaq. Get və onu tap.\""}, {"cls": "p", "text": "Qeydi bir də, bir də oxudum, amma mənasını tam qavraya bilmədim, sözlər mənasından çox səs kimi qulağımda qalırdı. Hakim hökmü, ya da qərarı oxumağa başlayanda zaldakı pıçıltılar, ayaq səsləri, kiminsə boğuq öskürəyi – hamısı bir-birinə qarışıb tək bir uğultuya çevrildi, mən ancaq parça-parça sözlər tuta bildim: – ...Təqsirləndirilən şəxsin psixi vəziyyəti nəzərə alınaraq, cəza çəkmə müəssisəsinə deyil, qapalı tibb müəssisəsinə – reabilitasiya mərkəzinə göndərilməsinə və orada nəzarət altında saxlanılmasına qərar verildi..."}], "wc": 157}, {"season_num": null, "season_title": null, "chapter_num": "1", "chapter_title": "4 aprel 1982", "heading": null, "paras": [{"cls": "p", "text": "Ömürlük həbs deyildi, bunu anladım, amma nə demək olduğunu tam dərk edə bilmədim. Qapılar açıldı, məni, ya da o otaqdakı hər kəsi bilmirəm, bayıra buraxdılar. Başım gicəllənirdi, tanış duman yenidən beynimin üstünə çökməyə başlamışdı, isti, ağır, hər şeyi öz içinə çəkən bir duman. Artıq hiss edirdim ki, bu astanadan keçən kimi – bu zal, bu adamlar, o kürsüdəki üz, bu qərar, hamısı bir-bir yaddaşımdan silinib gedəcək, elə bil heç yaşanmayıbmış kimi."}, {"cls": "p", "text": "Amma cibimdəki o qeyd yerində idi, əlimdəki köhnə də ıldayırdı. Ondan rahat idim. Çox yaraşıqlı, yaxşı bir oğlan olacaq böyüyəndə, onunla qürur duyuram. Arxayın uzandım yatağıma..."}], "wc": 226}, {"season_num": null, "season_title": null, "chapter_num": "3", "chapter_title": "7:43, 4 yanvar 1983", "heading": {"kind": "chapter", "num": "3", "title": "7:43, 4 yanvar 1983"}, "paras": [{"cls": "p", "text": "Oyandım. Səhər açılmışdı. Bu gün qorxulu bir yuxu gördüm. Mənə deyirdi ki, Johanna bax. Ayağa qalxıb Johannın qapısını açdıqda şoka düşmüşdüm. Oğlum orada yox idi. O böyük evin hər bir otağını didik-didik axtardım, yox idi... Axırda oğlumun otağına qayıdıb yatağına oturanda vərəqi gördüm. \"Mənim əziz Johannesim... Səni qətlə yetirəni əlbəttə tapacağam. O səni öldürməklə məndən bir parça qopardı. Oğlum... O kiçik, lakin mənim ruhumu böyüdən ruhun şad olsun. Şübhəsiz ki, mən sənin intiqamını alacağam.\" Çaşbaş qalmışdım. Oğlum ölmüşdü? Göz yaşlarımı saxlaya bilmədim, vərəq isə əvvəlcədən buruşmuş və sanki əvvəl islanıb sonra qurumuşdu. Ancaq bu vərəqi mən yazmışdım ki? O an arxasını çevirdim. \"Robert, yaddaşın səni yanıldır. Bu kağızı da yazan sənin özünsən. Oğlumu öldürüblər... Oğlumuzu öldürüblər. Ən pisi isə məhkəmədə cani sadəcə reabilitasiya ilə canını qurtardı. Canımdan canımı alan insan... indi isə azaddır. Hər kəsin içində gəzir. Hətta bəlkə də ən yaxınımızdadır... Robert, oğlumuz öldükdən sonra psixologiyamız pozuldu. Artıq bəzən hər gün, bəzən gündə 2 dəfə yaddaşımız silinir. Ona görə yanında dəftər gəzdir, Robert. Və hər səhər görə biləcəyin yerdə olsun ki, hər səhər hər şeyi yadına salasan.\" Bunu oxuyub evimdə oyanan kimi düz görə biləcəyim yerə – dolabın qapısına asdım. Qaça-qaça polis şöbəsinə gedib hadisələri öyrənmək istədim, ancaq bunların mülki vətəndaşa açıq olmadığını bildirərək məni yola saldılar... Bunu dəftərə qeyd etdim. Hardan başlayacağımı, necə məlumat alacağımı bilmirdim. Çarəsiz idim..."}], "wc": 220}, {"season_num": null, "season_title": null, "chapter_num": "4", "chapter_title": "8:24, 5 yanvar 1983", "heading": {"kind": "chapter", "num": "4", "title": "8:24, 5 yanvar 1983"}, "paras": [{"cls": "p", "text": "Oyandım. Oyandığımda üst-başım kirli idi. Qalxanda gördüm qapı açıqdır və masanın üstündə yazı var. Deyəsən qonşudan idi yazı. \"Səni tapanda polis şöbəsinin qarşısında yerdə uzanmışdın, həkimə getməlisən, Robert.\" Niyə yerdə yatmışdım görəsən? Hər nəysə, dedim, duş otağına doğru getdim. Əynimi soyunanda şalvarımın cibindən balaca bir dəftərçə çıxdı. Qoydum onu bir kənara, hamama girdim və çimməyə başladım. Su soyuq idi, amma bu da mənim ən sevdiyim idi. Hər nəysə, çıxanda özümlə dəftəri də götürüb ocağın yanında yerə sərildim. Dəftəri açdım. \"Robert, yaddaşımızda problem var, hər səhər oyananda hər şeyi unuduruq. Bu dəftər bizim rəhbərimizdir. Hər qəbul etdiyin yeni məlumatı bura yazmalısan. Oğlun vəfat edib, onun qatilini tapmalısan. 4 yanvar 1983-cü il tarixində, saat 12:20 radələrində polis şöbəsinə getdik və bizə mülki şəxs olduğumuz üçün heç bir məlumat vermədilər.\" Bilmirəm niyə, amma oğlumun ölüm xəbəri adi bir şeymiş kimi gəldi mənə. Lənətə gələsən, Robert, həyatındakı tək canlı ölüb, sən isə bunu adi qarşılayırsan. Kədərdən yox, qatilə əsəbdən yox, özümə əsəbdən, qəbullana bilməməkdən ötrü dərhal qalxdım, yemək yeməmiş yola düşdüm. Polislərdən necə məlumat alacağımı düşünərkən rüşvət verə biləcəyim ağlıma gəldi. İri gövdəli mühafizəçiyə yaxınlaşdım, pul təklif elədim. Ancaq bunun mümkün olmadığını dedi. Mən isə çox da düşünə bilmirdim artıq, zira səhər aldığım məlumat axını zehnim üçün yetəri qədər mürəkkəb idi. Çox düşünmədim. Planımı dəftərə qeyd etməyə başladım. Plan sadə idi. Axşamı gözləyəcəkdim. Polisin evinə qədər gedəcəkdim və hər şey hazır olacaqdı. Yəqin ki, paltarlarını götürər, vəsiqəsindən istifadə edərdim."}], "wc": 235}, {"season_num": null, "season_title": null, "chapter_num": "4", "chapter_title": "8:24, 5 yanvar 1983", "heading": null, "paras": [{"cls": "divider", "text": "20:04"}, {"cls": "p", "text": "Artıq vaxtı idi. Başıma-əlimə ilk gələn şeyi keçirdim. Yola düşdüm. Polislərdən birinin ardınca getməyə başladım. Yolda marketə dəydi, bir neçə şey alıb yenidən yola qoyuldu. Yol qaranlıq idi, həmçinin geyimim də elə idi, bu səbəbdən çox da fərqlənmirdim əslində divardan, daşdan. Beləliklə, onun qapısına qədər getdim. O içəri keçdikdən sonra qapısını kilitləməmişdi. Qaranlıq bir otağa keçib gizləndim. Deyəsən ailəcə yemək vaxtı idi. Ah, onlar, ailəmi əlimdən aldıqdan sonra yemək necə də keçir uşaqlarının boğazından..."}, {"cls": "p", "text": "\"Ata, bu gün bizim üçün nə almısan?\" – dedi uşaqlar atanın qucağına sevinclə qaça-qaça. Ana, atanın cibinə baxıb yenə xərcə girdiyini görüb heyfsiləndi, amma uşaqların sevincini görüb gülümsədi."}, {"cls": "p", "text": "\"Hazır ki, yemək vaxtıdır, alın, uşaqlar, düzün bunları masaya.\" Ata təndir çörəyi, bir az da pendir almışdı. Uşaqlar isə sanki sevincindən uçacaqdılar. Məgər polis bu qədər az qazanırsa, mühafizəçi nə qazanırdı güya? Niyə rüşvətimi qəbul etmədi ki? Hər nəysə. Bir xeyli gözlədim."}, {"cls": "divider", "text": "22:43"}, {"cls": "p", "text": "\"Robert.\" \"Robert, yaxşısan?\" \"Əzizim, ordan bir az su gətir, ayılır yavaş-yavaş deyəsən.\""}, {"cls": "p", "text": "– Mən hardayam? Siz kimsiniz? Nə edirsiniz?"}, {"cls": "p", "text": "\"Mənəm, Martin. Qonaq gəlmişdin bizə. Yemək yeyirdik, birdən yıxıldın. Həqiqətən məni tanımadın?\""}, {"cls": "p", "text": "– Yox, tanımadım."}], "wc": 180}, {"season_num": null, "season_title": null, "chapter_num": "4", "chapter_title": "8:24, 5 yanvar 1983", "heading": null, "paras": [{"cls": "p", "text": "\"Əşi, onsuz da bunu həmişə edirsən.\""}, {"cls": "p", "text": "– Nəyi edirəm ki?"}, {"cls": "p", "text": "\"Unutmağı.\""}, {"cls": "p", "text": "Qavramadım, amma susdum."}, {"cls": "p", "text": "\"Narahat olma. Əzizim, sən əlavə bir döşək at divana. Robert dincini alsın, səhər onunla işimiz var.\""}, {"cls": "p", "text": "Mən harada olduğumu, niyə orada olduğumu bilmirdim. Hazırladıqları divana uzandım, yerimi rahatlayanda üstümdə dəftərə rast gəldim. Oxumağa başladım:"}, {"cls": "p", "text": "\"Robert, yaddaşın səni yanıldır. Bu kağızı da yazan sənin özünsən. Oğlumu öldürüblər... Oğlumuzu öldürüblər. Ən pisi isə məhkəmədə cani sadəcə reabilitasiya ilə canını qurtardı. …. …. ….\" – dəftərin ortasında silinmiş nəhəng bir hissə var idi. Silginin tozları qalmışdı. Onun üstündə isə: \"Martin sənin uşaqlıq dostundur və polisdir. O sənə oğlunun qatilini tapmaqda dəstək olacaq.\" Oxuduqdan sonra oğlumun ölümünə qarşı çox biganə qalmışdım, niyəsini başa düşmədim, amma üstündə çox da dayanmadım. Əsas odur ki, etibarlı əllərdəyəm."}], "wc": 124}, {"season_num": null, "season_title": null, "chapter_num": "5", "chapter_title": "7:24, 6 yanvar 1983", "heading": {"kind": "chapter", "num": "5", "title": "7:24, 6 yanvar 1983"}, "paras": [{"cls": "p", "text": "Oyandım. Yerimdən qalxıb səhər yeməyim üçün süfrə düzəltməyə başladım. Çörəyi, yağı, pendiri qoymuşdum ki, qapı çalındı. Kimsə gəlmişdi, tanımırdım, ancaq xatırlayırdım."}, {"cls": "p", "text": "\"Dəftərinə bax.\""}, {"cls": "p", "text": "Dəftərimə baxdıqda oğlumun öldüyünü, intiqam alacağımı və Martin adında bir polisin uşaqlıq dostum olduğunu öyrəndim. Bu, yəqin ki, Martin idi."}, {"cls": "p", "text": "\"Dünən danışmışdıq, bu gün birlikdə oğlunun qatilini araşdıracaqdıq.\""}, {"cls": "p", "text": "Martin masaya oturdu, əlindəki köhnə, bez üzlü bir qovluğu açdı. Üstündə heç bir möhür, heç bir rəsmi işarə yox idi, sadəcə əl xətti ilə yazılmış vərəqlər."}, {"cls": "p", "text": "\"Şöbədən çıxartdım bunu,\" – dedi, səsini aşağı salaraq, sanki kimsə eşidəcəkmiş kimi. \"Rəsmi deyil, amma bizim aramızda qalsın.\""}, {"cls": "p", "text": "Vərəqləri bir-bir çevirdim. Tarixlər, saatlar, bir neçə ad – heç biri mənə bir şey demirdi. Yalnız bir cümlə diqqətimi çəkdi: \"Hadisə yerinin yaxınlığında bir qadın, gecə saat 23 radələrində, uzun boylu, arıq, ağ dərili, kirli saqqallı bir kişi görüb.\""}, {"cls": "p", "text": "– Bu kimdir? – soruşdum, barmağımı sətrin altına qoyaraq."}, {"cls": "p", "text": "\"Şahid. Amma adı yazılmayıb, ya da kimsə pozub. Görürsən?\""}, {"cls": "p", "text": "Baxdım, doğrudan da, adın olması lazım olan yerdə kiçik, təmiz bir boşluq var idi, sanki kimsə diqqətlə, məharətlə silmişdi."}, {"cls": "p", "text": "– Onu tapmalıyıq, – dedim. – Şahidi."}], "wc": 178}, {"season_num": null, "season_title": null, "chapter_num": "5", "chapter_title": "7:24, 6 yanvar 1983", "heading": null, "paras": [{"cls": "p", "text": "\"Tapacağıq, amma heç yadına gəlmirmi, məndən əvvəl bu qovluğu neçə dəfə oxumusan?\""}, {"cls": "p", "text": "Bilmirdim. Başımı buladım."}, {"cls": "p", "text": "\"Dəfələrlə, Robert. Hər dəfə eyni sualı verirsən mənə, hər dəfə 'onu tapmalıyıq' deyirsən. Mən də hər dəfə 'tapacağıq' deyirəm.\""}, {"cls": "p", "text": "Bu sözlər məni qəribə bir yerdə saxladı, nə qəzəbləndim, nə də təəccübləndim, sadəcə bir növ yorğun bir tanışlıq hiss etdim, elə bil bu söhbəti əvvəl də min dəfə eşitmişdim, amma xatirəsi yox idi, ancaq bədənimdə bir yorğunluq izi qalmışdı."}, {"cls": "p", "text": "Günortaya yaxın evdən çıxdıq. Şəhər soyuq idi, göy ağır buludlarla örtülmüşdü. Martin maşınını sürdü, mən pəncərədən keçən binalara baxdım, hamısı tanış idi, amma heç birinin adını xatırlamırdım. Qadının yaşadığı deyilən məhəlləyə çatanda Martin maşını saxladı, mənə baxdı."}, {"cls": "p", "text": "\"Hazır ol, bəlkə bu dəfə nəyisə xatırladar sənə.\""}, {"cls": "p", "text": "Qapını döydük. Uzun müddət heç kim açmadı. Nəhayət, içəridən ayaq səsləri gəldi, qapı yarıya qədər açıldı, yaşlı bir qadın, üzü qırışlı, gözləri ehtiyatlı."}, {"cls": "p", "text": "– Sən kimsən?"}, {"cls": "p", "text": "– Bir neçə sual vermək istəyirik, – dedi Martin, – 82-ci il haqqında."}, {"cls": "p", "text": "Qadının üzü birdən dəyişdi, sanki nəyisə xatırladı, amma dərhal qapını bağlamağa cəhd etdi. Ayağımı çərçivəyə qoydum, özüm də bilmədən."}], "wc": 176}, {"season_num": null, "season_title": null, "chapter_num": "5", "chapter_title": "7:24, 6 yanvar 1983", "heading": null, "paras": [{"cls": "p", "text": "– Xahiş edirəm, – dedim, səsim özümə də yad gəldi, çox sərt idi. – Oğlum haqqında."}, {"cls": "p", "text": "Qadın bir anlıq susdu, sonra gözlərini yumdu, dərin nəfəs aldı. Rəngi ağappaq idi. Qorxudan titrəyirdi. Martin qapını itələyərək içəri girdi. Qadın narahatlıqla qonaq otağını göstərdi. Əyləşdik."}, {"cls": "p", "text": "\"Danışın, heç kim sizə zərər verməyəcək. Sadəcə o gecə nə gördüyünüzü bilmək istəyirik.\""}, {"cls": "p", "text": "Onunla danışan Martin idi, amma qadın mənə baxaraq cavablandırırdı. Qadın əlləri titrəyərək ətəyini sıxdı, uzun müddət susdu, sonra pıçıltı ilə danışmağa başladı."}, {"cls": "p", "text": "– Pəncərəmdən gördüm onu... Saat gecəyarıya yaxın idi, yata bilmirdim, ürəyim narahat idi o axşam, bilmirəm niyə. Küçəyə baxdım, bir kişi gördüm, yavaş addımlarla gedirdi, arada dayanırdı, sanki özü ilə danışırdı."}, {"cls": "p", "text": "– Nə deyirdi? – soruşdum, səsim özümə yad gəldi, kobud, tələsik."}, {"cls": "p", "text": "Qadın mənə baxdı, ilk dəfə düz gözümün içinə, sonra yenə gözlərini yayındırdı."}, {"cls": "p", "text": "– Bir ad təkrarlayırdı. Dəfələrlə. Yaxşı eşitmədim, amma... Jack, Noah idi, nə isə buna bənzər bir şey deyirdi."}, {"cls": "p", "text": "\"Bəs o adam nəyə oxşuyurdu?\" – deyə soruşdum."}, {"cls": "p", "text": "– Bir az irihəcmli, qısaboylu idi. Bütün xatırladığım elə bundan ibarətdir."}, {"cls": "p", "text": "Bunları qeyd edib evə qayıtdıq. Martinlə sənədləri önümüzə sərib oturduq. Şahidin ifadəsində uyğunsuzluq var idi."}], "wc": 183}, {"season_num": null, "season_title": null, "chapter_num": "5", "chapter_title": "7:24, 6 yanvar 1983", "heading": null, "paras": [{"cls": "p", "text": "\"Sən yat, səhər yenidən baxarıq,\" – dedi Martin."}, {"cls": "p", "text": "Halım qalmamışdı. Yatağıma tərəf yeriyib uzandım."}], "wc": 14}, {"season_num": null, "season_title": null, "chapter_num": "6", "chapter_title": "12:43, 7 yanvar 1983", "heading": {"kind": "chapter", "num": "6", "title": "12:43, 7 yanvar 1983"}, "paras": [{"cls": "p", "text": "Oyandım. Zibilə qalsın, işə gecikmişəm. Əynimi dəyişib yeməyimi yedim. Oğlumun otağına getdim. Həmişəki ritualım idi – səhər qalxıb yeməyimi yedikdən sonra oğlumu öpmədən evdən çıxmazdım. Bunun onu bir cür qoruduğuna inanırdım. Oğlum... otağında deyildi. Hardadır axı? Hardasan axı? İşi filan tamam ağlımdan çıxarıb oğlumu axtarmağa başladım. Kaset tapdım evin ortasında. Üstündə \"Johannes 8-ci doğum günü\" yazılmışdı. Televizora qoşdum."}, {"cls": "p", "text": "Ekran bir neçə saniyə boz-ağ xışıltı ilə titrədi, sonra şəkil özünü tapdı – solğun künclərdə qaralmış, dövrün kameralarına xas o tanış görüntü. Küncdə qırmızı rəqəmlər yanıb-sönürdü: 08.02.1981."}, {"cls": "p", "text": "\"Səhər tezdən xəbərsiz gizlin çıxdım ki, hədiyyədən xəbəri olmasın, hələ oyanmamışdı balam,\" – deyirdi Robert kameranı düzəldərkən."}, {"cls": "p", "text": "Bağça idi, bizim bağça, indikindən daha yaşıl, daha canlı. Kimsə (səs tanış gəlirdi, özümünkü olmalıydı, deyəsən arxadan danışırdım) gülərək dedi: \"Bax bura, bax kameraya, Johann!\""}, {"cls": "p", "text": "Balaca bir oğlan uşağı – sarışın, kirpiklərinin altında parıldayan gözləri, əlindəki şokoladlı tortunu göstərib qışqırdı: \"Səkkiz! Mən artıq səkkiz olmuşam, ata!\""}, {"cls": "p", "text": "Ürəyim sıxıldı, elə bil kimsə ovcunu köksümə basıb sıxdı. Ekrandakı o səs, mənim səsim, bilirdim ki, mənimdir, amma indi tanımadığım yad bir adamın səsi kimi eşidilirdi, güldü, dedi: \"Səkkiz böyük rəqəmdir ha, yavaş-yavaş məni də keçirsən.\""}], "wc": 184}, {"season_num": null, "season_title": null, "chapter_num": "6", "chapter_title": "12:43, 7 yanvar 1983", "heading": null, "paras": [{"cls": "p", "text": "Ətrafında qohum-qonşunun uşaqları düzülmüşdü, bizim Johannla oynayırdı. Hərəsinin əlində bir-iki şar var idi. Tortun çoxu getmiş, azı qalmışdı. Johann isə yeni skuterini sürmək üçün can atırdı. Birdən ekran qarışqalanmağa başladı, televizorun üstünə yumruğumu vurdum, keçmədi, bir az sonra ekran dəyişdi həmin günün axşamına. Qaranlıq evdə yerdə konfetin zibilindən keçilmirdi, arada partlamış, arada dolu şarlar var idi. Kamera kimin əlindəydi ki? Hər nəysə, sakit-sakit yeriyirdi, uşaq qapısını açdı."}], "wc": 67}, {"season_num": null, "season_title": null, "chapter_num": "7", "chapter_title": "08:10, 8 yanvar 1983", "heading": {"kind": "chapter", "num": "7", "title": "08:10, 8 yanvar 1983"}, "paras": [{"cls": "p", "text": "Oyandım. Əl-üzümü yumaq üçün mətbəxə doğru yeridim və əl-üzümü yudum. Soyuducunun üstündə kağız var idi: zibilləri at, sonra da yatağının yanındakı dəftərin son səhifəsinə göz at. Zibilin içində dağınıq və parçalanmış kasetdən başqa bir şey yox idi. Şübhəli gəldi. Xeyr, bunu atmayacağam. Kaseti aldım və kasetçiyə doğru yola düşdüm. Yollar palçıqlı idi, qar yavaş-yavaş əriyirdi, mən isə hər ehtimala qarşı palto geyinmişdim. Axır ki, kasetçiyə çatdım. İşini yaxşı görməsi üçün ona əlavə bəxşiş də verdim. Nə vaxt hazır olacağını soruşdum. \"Dəqiq vaxt deyə bilmərəm, hardasa bərbad vəziyyətdədir, tezliklə çatdırmağa çalışaram. Poçtla göndərərəm, sadəcə ünvanınızı bura yazın.\""}], "wc": 96}, {"season_num": null, "season_title": null, "chapter_num": "7", "chapter_title": "08:10, 8 yanvar 1983", "heading": null, "paras": [{"cls": "p", "text": "Könülsüzcə yazdım, çox maraqlı gəlirdi içində nə olduğu. Qapıdan çıxdım və evə doğru yol aldım. Qar tufanı yenə başlamışdı. Cəld addımlarla çatdım evə, niyəsə üstümdə yorğunluq var idi. Yatağa yaxınlaşdım yatmağa, masanın üstündə dəftər gördüm. Soyuducunun üstündə bunu da oxumağım yazılmışdı. Oxudum, oğlum ölübmüş, mənim yaddaşım durmadan silinirmiş və sairə. Bunları bilirmişəm kimi hiss elədim. Axırıncı səhifədə isə kasetə baxma barədə uzun-uzadı yazılmışdı. Vərəqi cırıb zibil qutusuna atdım. Dəftərə isə kaseti kasetçiyə verdiyimi, poçtla göndərəcəyini yazıb kənara qoydum. Yuxum gəlirdi, amma yata bilmirdim. Yana çevrildim və düşünməyə başladım, kasetdə görəsən nə var idi? Görəsən uşağın qatiliylə bağlıydı? Ölüm necə bir şeydi ki görəsən? Uşaq vaxtı belə şeylərə heç baş yormazdım, ama artıq saçlarım ağarır, ölümə daha da yaxınlaşıram. O biri dünya necə bir yerdi ki? O vaxtı düşünürdüm iki pilləkən var, biri yuxarı, biri aşağı. Mən isə ortadayam. Ya yuxarı gedən pilləkən açarlı olurdu, ya da aşağı gedən pilləkən. O vaxtı aşağıdakı qapı açarlı idi. İndi isə ikisi də açarlıdır, əlimdə isə bir açar var, yanımda isə əlavə 3-cü qapı. Nə yuxarı gedən, nə də aşağı. Görəsən haradı bura? Əlimdə açar varkən açım baxım."}], "wc": 184}, {"season_num": null, "season_title": null, "chapter_num": "7", "chapter_title": "08:10, 8 yanvar 1983", "heading": null, "paras": [{"cls": "p", "text": "Açdım, meşəlik idi. Üzümü arxaya çevirəndə özümü 2 dənə gördüm, ikisi də kilidlərin ardında. Biri hüzurla yuxarı qalxırdı, biri isə aşağıdan yuxarı çıxmışdı, ama kilidli qapıdan keçə bilmirdi. Heç nə hiss etmirdim, yəqin ki bu naməlumluq bildirirdi. Bir az irəliləyəndə ev gördüm. Qədim taxtadan bir ev. Həyətdə yaşlı bir kişi balaca bir körpəylə oynayırdı. Kişi təxminən 80 yaşlarında, uşaq isə 3-4 yaşında olardı. Bir az sonra qapıdan bir cütlük çıxdı. Cütlük.. mənimlə xanımım idi. Qaça-qaça qucaqlamaq istədim. Görmürdülər məni. Qucaqlamaq istəyəndə isə içindən keçirdim. Onlar, ya da biz, köhnə model rus maşınına doğru yeriyirdilər. Digər mən yaşlı kişiyə səsləndi: \"Ata, uşağın yemək saatı yarım saatadır, yedirəndən sonra mamaya deyərsən yatırtsın.\" Bir anda kişinin üzü tanış simaya büründü. Bu həqiqətən atam idi. Göz yaşlarımı tuta bilmədən qaçdım üstünə. Onu da qucaqlaya bilmədim. Bəs oğlum? Yox.. onu da qucaqlaya bilmədim. Digər mənə doğru qaçdım. Əsəblə kədər qarışmışdı üzümdə. Roberti tutub maşına söykədim. Niyə qadınıma toxuna bilmirəm? Niyə oğluma, atama toxuna bilmirəm? – dedim. O isə gülümsəyərək: \"Sənin üçün gecdir. Vaxtında yetəri qədər sevməli idin. Lazımi qədər qucaqlamalı idin. Vaxtında sulanmayan ağac, quruyandan sonra göz yaşınla göyərməz.\" Ürəyimin parçalandığını eşitdim. Sonra Robertin bayaq mamadan bəhs etdiyini eşitdim. Göz yaşları içində evə qaçdım."}], "wc": 199}, {"season_num": null, "season_title": null, "chapter_num": "7", "chapter_title": "08:10, 8 yanvar 1983", "heading": null, "paras": [{"cls": "p", "text": "Mama, nolar məni eşit.."}, {"cls": "p", "text": "– Nə tez gəldin, oğlum? Məktəbdən qaçmısan? – sonra üzünü mənə çevirdi – Göz yaşların niyə axır? Dava eləmisən yenə? Müəlliminə şikayət edəcəm axır o uşaqları."}, {"cls": "p", "text": "Anama yaxınlaşıb qucaqladım. Qarşılıq verdi. Darıxdığımı onu yenidən görüncəyə qədər hiss etmirdim."}, {"cls": "p", "text": "– Əyləş stula. Ən sevdiyin yeməyi bişirirdim elə. Atan da odun toplamağa gedib. Harda olsa yarım saata gələr."}, {"cls": "p", "text": "Mama, bəs Rose? O hardadır?"}, {"cls": "p", "text": "– Yenə Rose? Elə dünən gəlmişdi də yeməyə bizə. Yenə darıxmısan. Səndə atavı görməmək mümkün deyil, Rob. O da uşaq vaxtı məktəbdə həmişə sinifimizə gəlirdi məni görməyə. Bir dəfəsində göndərdiyi məktubları atam tutmuşdu. 1 həftə məktəbə icazə vermədi, ama atan üçün bunun fərqi yox idi. Pəncərəmə dırmaşırdı həmin günlərdə də. İnşallah sənə də sən kimi oğul qismət olar, Rob. Səninlə qürur duyuram."}, {"cls": "p", "text": "Anam sıyıq bişirmişdi. Çoxdandı yemirdim heç sevimli yeməyimi… sanki cənnətdə idim, ilahi…"}, {"cls": "p", "text": "– Atan sən bu gün evdən çıxanda demişdi ki, hər gecə sənin gələcəkdə necə biri olacağın ona maraqlı gəlib. Deyirdi ki, nəvələrim olduğunda onlara balıq tutmağı, maşın sürməyi elə özüm öyrədəcəyəm. Oğlum, hələ yemə yeməyini, qoy soyusun, sonra."}], "wc": 177}, {"season_num": null, "season_title": null, "chapter_num": "8", "chapter_title": "04:23, 9 yanvar 1983", "heading": {"kind": "chapter", "num": "8", "title": "04:23, 9 yanvar 1983"}, "paras": [], "wc": 0}, {"season_num": null, "season_title": null, "chapter_num": "8", "chapter_title": "04:23, 9 yanvar 1983", "heading": null, "paras": [], "wc": 0 <script>
(function(){

  function isDesktop(){ var r=document.getElementById('rotor'); return (r ? r.clientWidth : window.innerWidth) >= 900; }

  function escapeHtml(s){

  function labelFor(idx){

  function buildPageInnerHTML(idx){
    if(idx < 0 || idx >= total){ return '<div class="blank-leaf">~</div>'; }
    var p = PAGES[idx];

    if(p.heading){
      if(p.heading.kind === 'season'){

      } else {
        html += '<div class="page-heading">';

      html += '<p class="ember-line l3">Robert sabah yenid\u0259n oyanacaq.</p>';
      html += '<div class="ember-embers"><span></span><span></span><span></span><span></span><span></span><span></span></div>';

      html += '<p class="page-num">' + (idx+1) + '</p>';

  function slotHTML(idx, side){
